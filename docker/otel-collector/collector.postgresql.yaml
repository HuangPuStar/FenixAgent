receivers:
  postgresql:
    endpoint: ${env:PG_MONITOR_ENDPOINT}
    username: ${env:PG_MONITOR_USERNAME}
    password: ${env:PG_MONITOR_PASSWORD}
    databases: ["${env:PG_MONITOR_DATABASE}"]
    collection_interval: 30s
    tls:
      insecure: false
      insecure_skip_verify: false
processors:
  resource/postgresql:
    attributes:
      - {key: service.name, value: fenix-postgresql, action: upsert}
      - {key: deployment.environment.name, value: "${env:DEPLOYMENT_ENVIRONMENT}", action: upsert}
service:
  pipelines:
    metrics/postgresql:
      receivers: [postgresql]
      processors: [memory_limiter, resource/postgresql, batch]
      exporters: [otlp_http/oo_metrics]
