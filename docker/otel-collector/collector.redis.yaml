receivers:
  redis:
    endpoint: ${env:REDIS_MONITOR_ENDPOINT}
    username: ${env:REDIS_MONITOR_USERNAME}
    password: ${env:REDIS_MONITOR_PASSWORD}
    collection_interval: 15s
    tls:
      insecure: false
      insecure_skip_verify: false
processors:
  resource/redis:
    attributes:
      - {key: service.name, value: fenix-redis, action: upsert}
      - {key: deployment.environment.name, value: "${env:DEPLOYMENT_ENVIRONMENT}", action: upsert}
service:
  pipelines:
    metrics/redis:
      receivers: [redis]
      processors: [memory_limiter, resource/redis, batch]
      exporters: [otlp_http/oo_metrics]
