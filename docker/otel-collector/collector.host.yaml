receivers:
  host_metrics:
    collection_interval: 15s
    root_path: /hostfs
    scrapers:
      cpu: {}
      memory: {}
      load: {}
      disk: {}
      filesystem: {}
      paging: {}
processors:
  resource/host:
    attributes:
      - {key: service.name, value: fenix-host, action: upsert}
      - {key: service.namespace, value: fenix, action: upsert}
      - {key: host.id, value: "${env:HOST_ID}", action: upsert}
      - {key: host.name, value: "${env:HOST_NAME}", action: upsert}
      - {key: deployment.environment.name, value: "${env:DEPLOYMENT_ENVIRONMENT}", action: upsert}
service:
  pipelines:
    metrics/host:
      receivers: [host_metrics]
      processors: [memory_limiter, resource/host, batch]
      exporters: [otlp_http/oo_metrics]
