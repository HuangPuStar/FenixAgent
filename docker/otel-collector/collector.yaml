extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  file_storage:
    directory: /var/lib/otelcol/storage
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        max_request_body_size: 4194304
  prometheus/internal:
    config:
      scrape_configs:
        - job_name: fenix-collector
          scrape_interval: 15s
          static_configs:
            - targets: [127.0.0.1:8888]
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 64
  batch:
    timeout: 1s
    send_batch_size: 256
    send_batch_max_size: 512
  resource/collector:
    attributes:
      - {key: service.name, value: fenix-collector, action: upsert}
      - {key: service.namespace, value: fenix, action: upsert}
      - {key: service.instance.id, value: "${env:OTELCOL_INSTANCE_ID}", action: upsert}
      - {key: host.id, value: "${env:HOST_ID}", action: upsert}
      - {key: deployment.environment.name, value: "${env:DEPLOYMENT_ENVIRONMENT}", action: upsert}
exporters:
  otlp_http/oo_traces:
    endpoint: ${env:OO_OTLP_ENDPOINT}
    encoding: proto
    compression: gzip
    timeout: 5s
    headers:
      Authorization: ${env:OO_AUTH_HEADER}
    sending_queue:
      enabled: true
      storage: file_storage
      sizer: bytes
      queue_size: 268435456
      num_consumers: 2
      block_on_overflow: false
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 30m
  otlp_http/oo_metrics:
    endpoint: ${env:OO_OTLP_ENDPOINT}
    encoding: proto
    compression: gzip
    timeout: 5s
    headers:
      Authorization: ${env:OO_AUTH_HEADER}
    sending_queue:
      enabled: true
      storage: file_storage
      sizer: bytes
      queue_size: 268435456
      num_consumers: 2
      block_on_overflow: false
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 30m
  otlp_http/oo_logs:
    endpoint: ${env:OO_OTLP_ENDPOINT}
    encoding: proto
    compression: gzip
    timeout: 5s
    headers:
      Authorization: ${env:OO_AUTH_HEADER}
      stream-name: fenix_logs
    sending_queue:
      enabled: true
      storage: file_storage
      sizer: bytes
      queue_size: 268435456
      num_consumers: 2
      block_on_overflow: false
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 30m
service:
  extensions: [health_check, file_storage]
  telemetry:
    logs:
      level: info
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces/app:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/oo_traces]
    metrics/app:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/oo_metrics]
    logs/app:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/oo_logs]
    metrics/collector:
      receivers: [prometheus/internal]
      processors: [memory_limiter, resource/collector, batch]
      exporters: [otlp_http/oo_metrics]
