# Sandbox 镜像 — 独立启动，连接远程 RCS 主服务器
# Usage:
#   docker compose -f docker/sandbox/docker-compose.yml build
#   docker compose -f docker/sandbox/docker-compose.yml up -d

services:
    sandbox:
        build:
            context: ../../
            dockerfile: docker/sandbox/Dockerfile
        container_name: rcs-sandbox
        restart: unless-stopped
        environment:
            RCS_URL: ${RCS_URL:?RCS_URL is required}
            RCS_SECRET: ${RCS_SECRET:?RCS_SECRET is required}
            RCS_MACHINE_ID: ${RCS_MACHINE_ID:?RCS_MACHINE_ID is required}
        volumes:
            - sandbox-workspaces:/app/workspaces

volumes:
    sandbox-workspaces:
