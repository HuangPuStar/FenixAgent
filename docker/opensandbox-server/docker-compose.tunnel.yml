services:
  opensandbox-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${OPENSANDBOX_SERVER_IMAGE:-aos/opensandbox-server:latest}
    command: ["opensandbox-server", "--config", "/etc/opensandbox/sandbox.toml"]
    privileged: true
    cgroup: host
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)\""]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    volumes:
      - docker-data:/var/lib/docker
      - ./workspace:/workspace
      - ./offline:/offline:ro
      - ./sandbox.toml:/etc/opensandbox/sandbox.toml:ro
      - ./data:/root/.opensandbox
      - ./frpc.toml:/etc/frp/frpc.toml:ro
    restart: unless-stopped

volumes:
  docker-data:
