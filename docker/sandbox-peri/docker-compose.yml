# Sandbox Peri 镜像 — CCB + Peri 客户端模式，连接远程 RCS 主服务器
# Usage:
#   docker compose -f docker/sandbox-peri/docker-compose.yml build
#   docker compose -f docker/sandbox-peri/docker-compose.yml up -d

services:
    sandbox-peri:
        build:
            context: ../../
            dockerfile: docker/sandbox-peri/Dockerfile
        container_name: rcs-sandbox-peri
        restart: unless-stopped
        environment:
            TZ: Asia/Shanghai
            RCS_URL: ${RCS_URL:?RCS_URL is required}
            RCS_SECRET: ${RCS_SECRET:?RCS_SECRET is required}
            RCS_MACHINE_ID: ${RCS_MACHINE_ID:?RCS_MACHINE_ID is required}
            # 下面的 command 要进行替换
            RCS_CCB_COMMAND: peri
            RCS_CCB_ARGS: acp
        volumes:
            # 本地开发：直接挂载宿主机 workspaces 目录，保证 file API / 前端文件面板
            # 与容器内 agent 看到的是同一份文件（避免 named volume 造成的文件分裂）。
            # 注意：容器以 root 运行，其创建的文件属主为 root。
            - ../../workspaces:/app/workspaces:rw
            - sandbox-peri-global:/app/.peri

volumes:
    sandbox-peri-global:
