networks:
  ragflow-net:
    driver: bridge

services:
  ragflow:
    image: infiniflow/ragflow:v0.26.0
    restart: unless-stopped
    command:
      - --enable-adminserver
    ports:
      # RAGFlow Web 页面：避免占用 80
      - "18080:80"
      # RAGFlow HTTP API：避免占用 9380
      - "19380:9380"
    expose:
      - "80"
      - "9380"
    environment:
      TZ: Asia/Shanghai
      DEVICE: cpu
      DOC_ENGINE: infinity
      API_PROXY_SCHEME: python

      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${RAGFLOW_MYSQL_PASSWORD:-ragflow_root_2026}
      MYSQL_DBNAME: rag_flow
      MYSQL_MAX_PACKET: 1073741824

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${RAGFLOW_REDIS_PASSWORD:-ragflow_redis_2026}

      MINIO_HOST: minio
      MINIO_PORT: 9000
      MINIO_USER: ${RAGFLOW_MINIO_USER:-rag_flow}
      MINIO_PASSWORD: ${RAGFLOW_MINIO_PASSWORD:-infini_rag_flow}

      INFINITY_HOST: infinity
      INFINITY_THRIFT_PORT: 23817
      INFINITY_HTTP_PORT: 23820
      INFINITY_PSQL_PORT: 5432

      SVR_WEB_HTTP_PORT: 80
      SVR_WEB_HTTPS_PORT: 443
      SVR_HTTP_PORT: 9380
      ADMIN_SVR_HTTP_PORT: 9381
      SVR_MCP_PORT: 9382
      GO_HTTP_PORT: 9384
      GO_ADMIN_PORT: 9383

      REGISTER_ENABLED: 1
      DOC_BULK_SIZE: 4
      EMBEDDING_BATCH_SIZE: 16
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: 1
    volumes:
      - ./ragflow_logs:/ragflow/logs
      - ./ragflow_data:/ragflow/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      infinity:
        condition: service_healthy
    networks:
      - ragflow-net

  mysql:
    image: mysql:8.0.39
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${RAGFLOW_MYSQL_PASSWORD:-ragflow_root_2026}
      MYSQL_DATABASE: rag_flow
    command:
      - --max_connections=1000
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --tls_version=TLSv1.2,TLSv1.3
      - --binlog_expire_logs_seconds=604800
    expose:
      - "3306"
    volumes:
      - ./ragflow_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-p${RAGFLOW_MYSQL_PASSWORD:-ragflow_root_2026}"]
      interval: 10s
      timeout: 10s
      retries: 120
    networks:
      - ragflow-net

  redis:
    image: valkey/valkey:8
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${RAGFLOW_REDIS_PASSWORD:-ragflow_redis_2026}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    expose:
      - "6379"
    volumes:
      - ./ragflow_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${RAGFLOW_REDIS_PASSWORD:-ragflow_redis_2026}", "ping"]
      interval: 10s
      timeout: 10s
      retries: 120
    networks:
      - ragflow-net

  minio:
    image: pgsty/minio:RELEASE.2026-03-25T00-00-00Z
    restart: unless-stopped
    command: ["server", "--console-address", ":9001", "/data"]
    environment:
      MINIO_ROOT_USER: ${RAGFLOW_MINIO_USER:-rag_flow}
      MINIO_ROOT_PASSWORD: ${RAGFLOW_MINIO_PASSWORD:-infini_rag_flow}
    expose:
      - "9000"
      - "9001"
    volumes:
      - ./ragflow_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 10s
      retries: 120
    networks:
      - ragflow-net

  infinity:
    image: infiniflow/infinity:v0.7.0
    restart: unless-stopped
    command: ["-f", "/infinity_conf.toml"]
    expose:
      - "23817"
      - "23820"
      - "5432"
    volumes:
      - ./ragflow_infinity_data:/var/infinity
      - ./infinity_conf.toml:/infinity_conf.toml:ro
    ulimits:
      nofile:
        soft: 500000
        hard: 500000
    healthcheck:
      test: ["CMD", "curl", "http://localhost:23820/admin/node/current"]
      interval: 10s
      timeout: 10s
      retries: 120
    networks:
      - ragflow-net