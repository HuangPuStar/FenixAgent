# docker/ragflow/ —— RAGFlow 检索栈 + Office 转 PDF（knowledge 模块使用）
# 权威文档：docs/operations/docker-topology.md §3（网络分层）、§5（对象存储）、§6（依赖目录契约）、
#           §8（env 文件规范）
#
# 本栈**自带全部依赖实例**（mysql / redis / rustfs / infinity 都是栈内服务），不消费任何共享实例：
#   - mysql（栈内服务 ragflow-mysql，只在 ragflow-net）：知识库元数据库；库 rag_flow 与账号 ragflow
#     由镜像的 MYSQL_DATABASE / MYSQL_USER 在数据目录初始化时直接建好，不再需要一次性初始化服务。
# 为什么自带：共享实例会让本栈与别的组件互相影响——一个栈的口令轮换、库空间占用、版本升级都会外溢。
# 对象存储同样是本栈自带（栈内服务 ragflow-rustfs）：RAGFlow 用多桶模式（每个知识库 kb_id、每个文件目录
# parent_id 是实例上一个真实桶，桶名是运行期 UUID，且这是与存量数据一致的布局），而共享实例只有**全实例一对
# 凭据**、实例侧也给不出「按消费方的桶策略」，在共享实例上无法为它建立有效的隔离边界。边界（照抄不放大）：
# **只用 RustFS 镜像**（rustfs/rustfs:1.0.1，不得引回 MinIO）、不接 fenix-server、不发布宿主端口、服务名
# 避开保留名 `rustfs`。完整裁定与理由见 README「本栈自带的对象存储」。
# 栈内保留的服务：ragflow-redis（Valkey，不换 redis 的证据见 README「自带 Valkey」）、infinity、
# ragflow-rustfs、gotenberg。
#
# 启动顺序（不变量）：镜像初始化建库建号（ragflow-mysql 健康检查通过）→ ragflow-s3-init 探测对象存储能力
# 并成功退出 → ragflow 启动。全部依赖都在本项目内，depends_on 就能表达，**没有跨项目等待**。
#
# 独立启动（不经 deploy.sh）：compose 只读项目目录 .env，因此先落一份配置再起：
#   cp docker/ragflow/.env.example docker/ragflow/.env      # 填 RAGFLOW_MYSQL_PASSWORD
#   docker compose -f docker/ragflow/docker-compose.yml up -d
# 随主服务一键启动：docker/deploy.env 里 FENIX_FEATURE_RAGFLOW=true（开关之间不自动联动，见 §6 末）。
#
# 网络：出口 `ragflow` 与 `gotenberg` 接入 external 网络 fenix-server（主服务按 http://ragflow:9380 与
# http://gotenberg:3000 访问它们）；其余服务全部只在栈内网络 ragflow-net。接入 fenix-server 的服务名因此是
# 跨项目 DNS 名，必须全局唯一：本栈刻意不用 `mysql` / `redis` / `rustfs` 这些保留名（§3 规则 7）——`ragflow`
# 容器同时挂在两张网上，栈内若也有一个叫 `rustfs` 的服务，它解析这个名字时两条记录都会被返回（取哪条取决于
# 返回顺序）。处置：`ragflow-redis`、`ragflow-mysql`、`ragflow-rustfs`。
# ragflow-net（本项目网络）：ragflow-mysql / ragflow-redis / infinity / ragflow-rustfs / ragflow-s3-init 在这里；
# ragflow 同时挂在两张网上。宿主端口只绑回环（18080 / 19380 / 3200），仅供本地源码调试；容器形态一律走
# fenix-server，不发布宿主端口。ragflow-rustfs 同样不发布宿主端口（要本机调试时按该服务内被注释的两行放开，
# 且只绑回环）。
#
# 数据：ragflow 的日志与运行数据 bind 在本目录 ./ragflow_logs 与 ./ragflow_data；本栈自有实例的数据按契约
# §13.8 落在 ./data/{mysql,rustfs}。本目录的历史布局（./ragflow_redis_data、./ragflow_infinity_data）本次
# 不动——新旧两种布局的对照与旧目录（./ragflow_mysql_data、./ragflow_minio_data）的处置见 README「数据落点」。
# 镜像 tag 一律固定版本、写在本文件里，不经环境变量插值（§13.7）。

networks:
  ragflow-net:
    # 项目内层网络：栈内辅助服务（ragflow-mysql / ragflow-redis / infinity / ragflow-rustfs）只在这里
    driver: bridge
  fenix-server:
    # 主服务层网络：顶层项目（仓库根 docker-compose.yml）创建，本目录只引用；
    # 因此本目录启动前顶层必须已启动（§3 规则 5）。
    external: true

services:
  # ── 本栈自带的元数据库 ────────────────────────────────────────────────────────
  # 库 rag_flow 与账号 ragflow@'%' 由镜像的 MYSQL_DATABASE / MYSQL_USER 在数据目录初始化时直接建好，
  # 因此不需要一次性的建库建号服务；账号权限天然只有自己那个库，不外溢。
  ragflow-mysql:
    # 固定版本：SQL 语法、认证插件与既有数据目录的一致性都依赖它（§13.7）。
    image: mysql:8.4.5
    restart: unless-stopped
    # 字符集参数与 dev 形态（docker/dev/docker-compose.ragflow.yml）一致。
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      # root 口令只在数据目录初始化时生效，本栈没有任何别的消费方；生产仍必须覆盖（默认值写在仓库里等于公开）。
      MYSQL_ROOT_PASSWORD: ${RAGFLOW_MYSQL_ROOT_PASSWORD:-ragflow123}
      MYSQL_DATABASE: rag_flow
      MYSQL_USER: ragflow
      # 账号口令：本栈私有键，只定义在本目录 .env（键与取值见 .env.example）；ragflow 用它拼连接串，两侧同值。
      MYSQL_PASSWORD: ${RAGFLOW_MYSQL_PASSWORD:?RAGFLOW_MYSQL_PASSWORD 未设置：请在 docker/ragflow/.env 配置（ragflow 账号的口令），见 docker/ragflow/README.md}
    volumes:
      # 契约 §13.8：数据一律 bind 同级 ./data/...
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      # 用真实查询而不是 `mysqladmin ping`：ping 在口令不对时同样返回成功（服务器活着就算通过），
      # 那样「口令改了但数据目录还是旧的」这类漂移不会暴露；这里连不上就直接 unhealthy。
      # `$$` 是容器内 shell 展开（CMD-SHELL 形式）。
      test:
        [
          "CMD-SHELL",
          "mysql -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" -e 'SELECT 1' >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      # 只在项目内网络：它不向别的组件提供数据库，没有跨项目寻址需求。
      # 服务名不叫 `mysql`：那是保留名（§3 规则 7），ragflow 同时挂在两张网上，同名会造成解析歧义。
      - ragflow-net

  # ── 一次性初始化：探测本栈 rustfs 实例的能力（建桶 / 读写 / 删对象） ──────────────
  ragflow-s3-init:
    # 复用本栈已有的 ragflow 镜像：不新增镜像来源，而且它自带的正是 RAGFlow 运行期用的 minio 客户端
    # （minio-py 7.2.4），于是这一步同时也是「RAGFlow 能否与 rustfs 通话」的兼容性验证——
    # path-style 寻址、GetBucketLocation 区域探测、SigV4 签名、建桶 + 读写 + 删对象的能力，全部在启动前走一遍。
    # 多桶模式下本栈的桶由 RAGFlow 运行期自建（桶名是 kb_id / parent_id 这样的 UUID，事先不存在），
    # 因此本服务建的是它自己的探测桶，跑完即删（详见 ./init-s3.py 的头注释）。
    # 上游只发布 amd64（Docker Hub 上无 arm64 变体）：写死平台，否则 arm64 主机（Mac）拉取直接报
    # no matching manifest；上游补发 arm64 后与本栈 ragflow 服务一起删除本行。
    image: infiniflow/ragflow:v0.26.0
    platform: linux/amd64
    restart: "no"
    # 直接用 python3 跑脚本（镜像内 PATH 已指向自带 venv，minio 就在里面）：S3 初始化逻辑用客户端库
    # 写比用 shell + 手搓 SigV4 可靠得多，也不需要额外引入 mc / aws-cli 这类客户端镜像。
    entrypoint: ["python3", "/init/init-s3.py"]
    environment:
      # 容器内地址写显式值：ragflow-rustfs 是本栈实例在 ragflow-net 上的服务名。
      S3_ENDPOINT: ragflow-rustfs:9000
      # 本栈私有凭据：只定义在本目录 .env（键见 .env.example），与实例侧 ragflow-rustfs 同值。
      S3_ACCESS_KEY: ${RAGFLOW_S3_ACCESS_KEY:-ragflow}
      S3_SECRET_KEY: ${RAGFLOW_S3_SECRET_KEY:-ragflow-local-dev}
    volumes:
      - type: bind
        source: ./init-s3.py
        target: /init/init-s3.py
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      # 同项目内成立：实例就绪由健康检查保证，不需要跨项目等待。
      ragflow-rustfs:
        condition: service_healthy
    networks:
      # 只访问同项目的对象存储实例，因此不进 fenix-server（接入面越小，跨项目 DNS 名越不容易撞车）。
      - ragflow-net

  # ── 本栈自带的对象存储 ────────────────────────────────────────────────────────
  # 自有实例是必须的：RAGFlow 用多桶模式（每个知识库 kb_id、每个文件目录 parent_id 是运行期 UUID 的**真实桶**，
  # 且这是与存量数据一致的布局），共享实例只有全实例一对凭据、实例侧也给不出「按消费方的桶策略」——
  # 在共享实例上为它建立有效的隔离边界做不到。隔离到自己的实例后，越权与跨栈桶命名空间问题同时消失。
  # 裁定与四条边界见 README「本栈自带的对象存储」与 docs/operations/docker-topology.md §5。
  ragflow-rustfs:
    # 只用 RustFS（不得引回 MinIO），固定版本（§13.7）。
    image: rustfs/rustfs:1.0.1
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ACCESS_KEY: ${RAGFLOW_S3_ACCESS_KEY:-ragflow}
      RUSTFS_SECRET_KEY: ${RAGFLOW_S3_SECRET_KEY:-ragflow-local-dev}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      # 契约 §13.8：数据一律 bind 同级 ./data/...（本目录的历史布局 ./ragflow_*_data 本次不动，
      # 新旧两种布局的对照见 README「数据落点」）。
      - ./data/rustfs:/data
    # S3 API（9000）与控制台（9001）默认只在内网可用；本机调试需要时按下面两行放开，且只绑回环（契约 §6.4）。
    # ports:
    #     - "127.0.0.1:9000:9000"
    #     - "127.0.0.1:9001:9001"
    healthcheck:
      # 与 docker/workflow/ 的 rustfs 同参：镜像行为只在这套取值上被实测过，不引入未验证的差异。
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      # 只在项目内网络：它不向别的组件提供存储，没有跨项目寻址需求，因此不接 fenix-server，也不发布宿主端口。
      # 服务名不叫 `rustfs`：`rustfs` 是保留名（§3 规则 7）。ragflow 容器同时挂在两张网上，栈内若也有一个
      # `rustfs`，它解析这个名字时两条记录都会被返回——与 `ragflow-redis` 同一处置。
      - ragflow-net

  ragflow:
    # 上游只发布 amd64（Docker Hub 上无 arm64 变体）：写死平台让 arm64 主机（Mac）走模拟运行，
    # 否则拉取直接报 no matching manifest；上游补发 arm64 后与 ragflow-s3-init 一起删除本行。
    image: infiniflow/ragflow:v0.26.0
    platform: linux/amd64
    restart: unless-stopped
    command:
      - --enable-adminserver
    ports:
      # RAGFlow Web 页面：用浏览器拿 API key、建知识库
      - "${RAGFLOW_WEB_PORT:-18080}:80"
      # RAGFlow HTTP API：供本地源码运行（bun run dev）的 RAGFLOW_API_URL 使用
      - "${RAGFLOW_API_PORT:-19380}:9380"
    expose:
      - "80"
      - "9380"
    environment:
      TZ: Asia/Shanghai
      DEVICE: cpu
      DOC_ENGINE: infinity
      API_PROXY_SCHEME: python

      # 本栈自带的 MySQL（栈内服务 ragflow-mysql）：库 rag_flow 与账号 ragflow 由实例初始化时直接建好，
      # ragflow 只拿到「自己那个库」的权限（不是实例的应用账号，也不是 root）。
      MYSQL_HOST: ragflow-mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ragflow
      MYSQL_PASSWORD: ${RAGFLOW_MYSQL_PASSWORD:?RAGFLOW_MYSQL_PASSWORD 未设置：请在 docker/ragflow/.env 配置（ragflow 账号的口令），见 docker/ragflow/README.md}
      MYSQL_DBNAME: rag_flow
      MYSQL_MAX_PACKET: 1073741824

      # 栈内 Valkey：不换外部 redis 的几条证据见 README「自带 Valkey」；服务名带前缀——`redis` 是保留名，
      # ragflow 同时挂在两张网上，同名会让 DNS 解析歧义。
      REDIS_HOST: ragflow-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${RAGFLOW_REDIS_PASSWORD:-ragflow_redis_2026}

      # 本栈自带的对象存储（栈内服务 ragflow-rustfs，只在 ragflow-net）：裁定与理由见本文件头部与 README。
      # **刻意不设桶名** —— 这是多桶模式，不是漏配：RAGFlow 的「逻辑桶」（知识库 kb_id、文件目录 parent_id）
      # 会成为本栈实例上的真实桶，且由 RAGFlow 在首次写入时自建（rag/utils/minio_conn.py 的 put()：
      # `if not self.bucket and not self.conn.bucket_exists(bucket): make_bucket(bucket)`）——桶名是运行期
      # UUID，任何初始化服务都无法事先建出来，所以本栈不再有「建桶」这一步（探测见 ragflow-s3-init）。
      # 选多桶的理由：它与**既有存量数据布局一致**（旧栈内 MinIO 同样是每个逻辑桶一个桶），搬迁时对象键不用重打。
      # 警告：事后擅自设回 `MINIO_BUCKET`（本编排里那行已删除；它对应上游 service_conf.yaml 的 `minio.bucket`）
      # 会把键布局改成 `<逻辑桶>/<对象名>`（use_prefix_path 生效），使已有对象全部读不到——那是数据可见性回归，
      # 必须先按 README「数据搬迁」做对象搬迁才能改，不要只加一行环境变量。
      MINIO_HOST: ragflow-rustfs
      MINIO_PORT: 9000
      MINIO_USER: ${RAGFLOW_S3_ACCESS_KEY:-ragflow}
      MINIO_PASSWORD: ${RAGFLOW_S3_SECRET_KEY:-ragflow-local-dev}

      INFINITY_HOST: infinity
      INFINITY_THRIFT_PORT: 23817
      INFINITY_HTTP_PORT: 23820
      INFINITY_PSQL_PORT: 5432

      SVR_WEB_HTTP_PORT: 80
      SVR_WEB_HTTPS_PORT: 443
      SVR_HTTP_PORT: 9380
      ADMIN_SVR_HTTP_PORT: 9381
      SVR_MCP_PORT: 9382
      GO_HTTP_PORT: 9384
      GO_ADMIN_PORT: 9383

      REGISTER_ENABLED: 1
      DOC_BULK_SIZE: 4
      EMBEDDING_BATCH_SIZE: 16
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: 1
    volumes:
      - ./ragflow_logs:/ragflow/logs
      - ./ragflow_data:/ragflow/data
    depends_on:
      # 库与账号由 ragflow-mysql 初始化时直接建好，健康检查保证「能连上且口令对」才放行。
      ragflow-mysql:
        condition: service_healthy
      # 等它「跑完并成功」而不是「就绪」——对象存储能力探测失败就不该放行 ragflow。
      ragflow-s3-init:
        condition: service_completed_successfully
      ragflow-rustfs:
        condition: service_healthy
      ragflow-redis:
        condition: service_healthy
      infinity:
        condition: service_healthy
    networks:
      # 出口之一：接入主服务层（主服务按 http://ragflow:9380 访问它），同时留在栈内网络访问辅助服务（§3）
      - ragflow-net
      - fenix-server

  # Office 文档转 PDF。由 knowledge 模块按 GOTENBERG_URL 直连，是「文档先转 PDF、再交给 RAGFlow 解析」
  # 这条链路上的上游；并入本栈的理由就是它与 ragflow 同属一个能力的两个环节，共用一份 .env 与一次启停，
  # 不再需要独立的 feature 开关（原 docker/gotenberg/ 目录与 FENIX_FEATURE_GOTENBERG 已退役）。
  # 它不依赖栈内任何服务（ragflow-redis / infinity），因此只挂 fenix-server，不进 ragflow-net：
  # 网络成员是「需要与主服务直接通信」的最小必要集，多挂一张网只会扩大栈间可达面（§3）。
  # 宿主端口只供本地源码调试（GOTENBERG_URL=http://127.0.0.1:3200，与模块声明的默认值对齐）。
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    networks:
      - fenix-server
    ports:
      - "127.0.0.1:${GOTENBERG_PORT:-3200}:3000"
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # 栈内 Valkey。**不换平台那个 redis**，理由与证据见 README「自带 Valkey」：
  # 平台实例没有鉴权（无 requirepass），而 RAGFlow 的入口脚本在口令为空时会退回内置默认口令，
  # 于是「把 RAGFlow 指到无口令实例」这条路径根本走不通；镜像与上游 valkey:8 一致，口令每次启动从命令行取。
  # 服务名不加 `redis`：`redis` 是保留名，ragflow 在两张网上，同名会造成解析歧义（§3 规则 7）。
  ragflow-redis:
    image: valkey/valkey:8
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${RAGFLOW_REDIS_PASSWORD:-ragflow_redis_2026}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    expose:
      - "6379"
    volumes:
      - ./ragflow_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${RAGFLOW_REDIS_PASSWORD:-ragflow_redis_2026}", "ping"]
      interval: 10s
      timeout: 10s
      retries: 120
    networks:
      - ragflow-net

  infinity:
    image: infiniflow/infinity:v0.7.0
    restart: unless-stopped
    command: ["-f", "/infinity_conf.toml"]
    expose:
      - "23817"
      - "23820"
      - "5432"
    volumes:
      - ./ragflow_infinity_data:/var/infinity
      - ./infinity_conf.toml:/infinity_conf.toml:ro
    ulimits:
      nofile:
        soft: 500000
        hard: 500000
    healthcheck:
      test: ["CMD", "curl", "http://localhost:23820/admin/node/current"]
      interval: 10s
      timeout: 10s
      retries: 120
    networks:
      - ragflow-net
