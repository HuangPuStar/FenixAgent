# docker/litellm/ —— LiteLLM 模型网关（model-management 模块使用）
# 权威文档：docs/operations/docker-topology.md §3（网络分层）、§6（依赖目录契约）、§8（env 文件规范）
#
# 为什么单独一份：网关是 Provider 凭据、Virtual Key、预算与用量的事实来源，本文件只负责这一个依赖；
# 平台侧只认地址与密钥（RCS_MODEL_GATEWAY_*），编排不写进顶层。
#
# 数据库**本栈自带**（栈内服务 litellm-postgres）：库 litellm 与角色 litellm 由 postgres 镜像的
# POSTGRES_USER / POSTGRES_DB 在数据目录初始化时直接建好，因此不需要一次性初始化服务。
# 为什么自带而不是共用平台那个 postgres：网关的库（Provider 凭据、Virtual Key、用量）与平台库的生命周期、
# 备份、升级节奏都不同，共用实例会让一方的口令轮换、库空间、版本升级外溢到另一方。
#
# 启动顺序（不变量）：底层实例健康检查通过（pg_isready）→ litellm 启动。全部依赖都在本项目内，
# depends_on 就能表达，**没有跨项目等待**。
#
# 独立启动（不经 deploy.sh）：compose 只读项目目录 .env，因此先落一份配置再起：
#   cp docker/litellm/.env.example docker/litellm/.env     # 填 LITELLM_DB_PASSWORD / LITELLM_MASTER_KEY / LITELLM_SALT_KEY
#   docker compose -f docker/litellm/docker-compose.yml up -d
# 随主服务一键启动：docker/deploy.env 里 FENIX_FEATURE_LITELLM=true。
#
# 网络：网关被主服务按 RCS_MODEL_GATEWAY_BASE_URL 直连，因此 litellm 接 fenix-server；
# litellm-postgres 只被同项目的 litellm 访问，但它与 litellm 同处一个项目、没有别的栈内服务，为两个服务
# 单开一张内层网络的收益不抵复杂度，因此同接 fenix-server——服务名带组件前缀，避开保留名 `postgres`
# （§3 规则 7：`postgres` 是平台实例在 fenix-server 上的名字，同名会造成解析歧义）。
# 宿主端口只绑回环：本地源码运行（bun run dev）与管理控制台访问用，不对外暴露。

services:

    litellm-postgres:
        # 库名与角色名写死（与下方 DATABASE_URL 同值），不从环境传：它们不是部署参数，
        # 多一个入口只会多一处能改错的地方。口令是部署参数，缺省即启动失败。
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: litellm
            POSTGRES_DB: litellm
            POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD:?LITELLM_DB_PASSWORD 未设置：请在 docker/litellm/.env 配置（litellm 角色的口令），见 docker/litellm/README.md}
        volumes:
            # 契约 §13.8：数据一律 bind 同级 ./data/...
            - ./data/postgres:/var/lib/postgresql/data
        healthcheck:
            # pg_isready 只看实例是否接受连接；口令不对时它不会失败——因此拉起的 litellm 必须能自己报错，
            # 不能靠这里兜住口令漂移（见 README 排障）。
            test: ["CMD-SHELL", "pg_isready -U litellm"]
            interval: 5s
            timeout: 5s
            retries: 5
        networks:
            - fenix-server

    litellm:
        # 固定版本：升级时同时更新本行，与 docker/dev/ 的同名服务保持一致（§13.7）。
        image: ghcr.io/berriai/litellm:v1.93.0
        container_name: fenix-litellm
        restart: unless-stopped
        depends_on:
            # 库与角色由 litellm-postgres 初始化时直接就绪，健康检查保证顺序。
            litellm-postgres:
                condition: service_healthy
        networks:
            - fenix-server
        ports:
            # 只绑回环：宿主上的 curl 与浏览器控制台用；平台容器走 fenix-server 内的 4000
            - "127.0.0.1:${LITELLM_PORT:-4000}:4000"
        environment:
            # 容器内地址写显式值（不插值同名宿主键，契约 §8.4）：litellm-postgres 是本文件的服务名，
            # 库名/角色名与上面写死的一致。
            DATABASE_URL: "postgresql://litellm:${LITELLM_DB_PASSWORD:?LITELLM_DB_PASSWORD 未设置：请在 docker/litellm/.env 配置（litellm 角色的口令），见 docker/litellm/README.md}@litellm-postgres:5432/litellm"
            # 网关管理密钥：rcs 侧用**同一个插值键名**引用（RCS_MODEL_GATEWAY_ADMIN_KEY），两处自动同值、零人工同步。
            LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY 未设置：请在 docker/litellm/.env 配置，且须与主服务 env 的 RCS_MODEL_GATEWAY_ADMIN_KEY 同值}
            # 库内 Provider 凭据的加密盐：换值后已有凭据解不开，升级时必须填回原值。
            LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?LITELLM_SALT_KEY 未设置：请在 docker/litellm/.env 配置；它加密库内 Provider 凭据，已有数据的部署要填回原值}
            # 丢弃上游模型不支持的请求参数，例如当前模型不接受的 thinking。
            LITELLM_DROP_PARAMS: "True"
            STORE_MODEL_IN_DB: "True"
            # 全部路由挂在 /litellm 下：平台基址因此要带这个前缀（见 README 的「待确认」一节）
            SERVER_ROOT_PATH: "/litellm"
            UI_USERNAME: admin
            UI_PASSWORD: ${LITELLM_UI_PASSWORD:-admin}

networks:
    fenix-server:
        external: true
