# docker/litellm/ —— LiteLLM 模型网关（model-management 模块使用）
# 权威文档：docs/operations/docker-topology.md §6（依赖目录契约）
#
# 为什么单独一份：网关是 Provider 凭据、Virtual Key、预算与用量的事实来源，本文件只负责这一个依赖；
# 平台侧只认地址与密钥（RCS_MODEL_GATEWAY_*），编排不写进顶层。
#
# 数据库不在本目录：原先自带的 litellm-postgres 已删除，改为消费 docker/common/ 的共享 postgres
# （收敛理由、代价与旧数据处置见 README「共享 PostgreSQL」一节）。共享实例只提供「实例」、不做任何栈的
# 业务初始化（契约 §5），因此**本目录自己**用一次性服务 litellm-db-init 建自己的库与角色——
# 与 docker/workflow/ 的 mysql-init 同一形态。
#
# 启动顺序：先起顶层项目（./docker/deploy.sh up，或只起共享实例：
#   docker compose -f docker-compose.yml up -d postgres），再起本目录。
# 跨项目的 depends_on 表达不了，这是 compose 的硬限制（实测报
#   service "litellm-db-init" depends on undefined service "postgres": invalid compose project，
# 加 required: false 也照样报），所以 litellm-db-init 自己等实例就绪，litellm 再以「它成功退出」为前置。
#
# 独立项目启动（共享实例已在同一台机器上跑）。不经过 deploy.sh 时自己把两个 env 文件喂给 compose 插值：
# 指定 --env-file 后 compose 不再自动读项目目录的 .env，所以要显式列全；**后一个优先**，因此仓库根 .env
# 放最后——共享键（LITELLM_DB_PASSWORD / POSTGRES_PASSWORD）只定义在那里（契约 §8.3、§8.5）：
#   cp docker/litellm/.env.example docker/litellm/.env     # 填 LITELLM_MASTER_KEY / LITELLM_SALT_KEY
#   docker compose --env-file docker/litellm/.env --env-file ./.env \
#     -f docker/litellm/docker-compose.yml up -d
# 随主服务一键启动：docker/deploy.env 里 FENIX_FEATURE_LITELLM=true（共享键由仓库根 .env 经脚本导出）。
#
# 网络：litellm 与 litellm-db-init 都接入 fenix-server——前者被主服务按 RCS_MODEL_GATEWAY_BASE_URL 直连，
# 两者都要按服务名 postgres 访问共享实例（跨项目 DNS 名只在 fenix-server 上，契约 §3）。
# 宿主端口只绑回环：本地源码运行（bun run dev）与管理控制台访问用，不对外暴露。

services:

    litellm-db-init:
        # 一次性：在共享实例里建 litellm 的库与角色，建完即退出（幂等，重跑只同步口令、不重建、不删数据）。
        # 库名与角色名本目录自己持有（与下方 DATABASE_URL 同值），不从环境传：它们不是部署参数，
        # 多一个入口只会多一处能改错的地方。口令是共享键，只定义在仓库根 .env（契约 §8.3）。
        image: postgres:16-alpine
        restart: "no"
        networks:
            - fenix-server
        environment:
            # 共享实例的超级用户：容器之间是 TCP 连接，非回环地址走 scram 认证，必须带口令。
            # 地址写显式服务名，不插值同名宿主键（契约 §8.4）：postgres 是它在 fenix-server 上的名字。
            PGHOST: postgres
            PGUSER: rcs
            PGPASSWORD: ${POSTGRES_PASSWORD:-rcs}
            PGDATABASE: postgres
            # 要用它建角色的口令；与 litellm 的 DATABASE_URL、共享实例里的角色口令必须是同一个值。
            LITELLM_DB_PASSWORD: ${LITELLM_DB_PASSWORD:?LITELLM_DB_PASSWORD 未设置：请在仓库根 .env 配置（共享 postgres 里 litellm 角色的口令），建库建角色由 litellm-db-init 自动完成，见 docker/litellm/README.md}
        # 逻辑在 ./init-db.sh（本目录的部署面文件），不内联在这里：内联后这段分支 + heredoc 无法 review，
        # 脚本里的 shell 变量还会被 compose 的插值吃掉（docker/workflow/ 的同类服务踩过这个坑）。
        # 显式覆盖入口：postgres 镜像自带的 entrypoint 会做 initdb / 参数分派，不覆盖就走错路径。
        entrypoint: ["/bin/sh", "/init/init-db.sh"]
        volumes:
            # 只读挂载，脚本随本目录交付（契约 §6.1 目录自包含；独立部署时别漏了这个文件）
            - ./init-db.sh:/init/init-db.sh:ro

    litellm:
        image: ghcr.io/berriai/litellm:v1.93.0
        container_name: fenix-litellm
        restart: unless-stopped
        depends_on:
            # 库与角色就绪才起 litellm：一次性服务失败（退出码非 0）时它不会被拉起，失败不静默。
            litellm-db-init:
                condition: service_completed_successfully
        networks:
            - fenix-server
        ports:
            # 只绑回环：宿主上的 curl 与浏览器控制台用；平台容器走 fenix-server 内的 4000
            - "127.0.0.1:${LITELLM_PORT:-4000}:4000"
        environment:
            # 容器内地址写显式值（不插值同名宿主键，契约 §8.4）：postgres 是共享实例在 fenix-server 上的服务名，
            # 库名/角色名与 litellm-db-init 写死的一致；口令是共享键，只定义在仓库根 .env（契约 §8.3）。
            DATABASE_URL: "postgresql://litellm:${LITELLM_DB_PASSWORD:?LITELLM_DB_PASSWORD 未设置：请在仓库根 .env 配置（共享 postgres 里 litellm 角色的口令），建库建角色由 litellm-db-init 自动完成，见 docker/litellm/README.md}@postgres:5432/litellm"
            # 共享键：随主服务启动时由仓库根 .env 提供；独立部署时在本目录 .env 提供（见 .env.example）。
            # 两处都写时以仓库根 .env 为准（脚本把它导出为 shell 环境，优先于项目 .env，契约 §8.5）。
            LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY 未设置：请在仓库根 .env（随主服务启动）或 docker/litellm/.env（独立部署）配置，且须与根 .env 的 RCS_MODEL_GATEWAY_ADMIN_KEY 同值}
            LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?LITELLM_SALT_KEY 未设置：请在仓库根 .env（随主服务启动）或 docker/litellm/.env（独立部署）配置；它加密库内 Provider 凭据，已有数据的部署要填回原值}
            # 丢弃上游模型不支持的请求参数，例如当前模型不接受的 thinking。
            LITELLM_DROP_PARAMS: "True"
            STORE_MODEL_IN_DB: "True"
            # 全部路由挂在 /litellm 下：平台基址因此要带这个前缀（见 README 的「待确认」一节）
            SERVER_ROOT_PATH: "/litellm"
            UI_USERNAME: admin
            UI_PASSWORD: ${LITELLM_UI_PASSWORD:-admin}

networks:
    fenix-server:
        external: true
