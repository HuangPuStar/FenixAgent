# Sandbox dsh 镜像 — DeepSeek Harness 伪装为 ccb 槽位，连接远程 RCS 主服务器
# Usage:
#   docker compose -f docker/sandbox-dsh/docker-compose.yml build
#   docker compose -f docker/sandbox-dsh/docker-compose.yml up -d
#
# 必填连接配置：RCS_URL、RCS_SECRET（与主服务器一致）、RCS_MACHINE_ID（页面预创建的唯一 ID）
# 模型配置：主服务器上为 Agent 绑定模型后自动下发，容器内无需配置

services:
    sandbox-dsh:
        build:
            context: ../../
            dockerfile: docker/sandbox-dsh/Dockerfile
        container_name: rcs-sandbox-dsh
        restart: unless-stopped
        environment:
            TZ: Asia/Shanghai
            RCS_URL: ${RCS_URL:?RCS_URL is required}
            RCS_SECRET: ${RCS_SECRET:?RCS_SECRET is required}
            RCS_MACHINE_ID: ${RCS_MACHINE_ID:?RCS_MACHINE_ID is required}
            # ccb handler 通过这两个变量覆盖引擎启动命令：
            #   node /usr/local/bin/dsh-acp-wrapper.js（wrapper 解析 ccb settings 生成 cordis.yml 并 exec dsh）
            RCS_CCB_COMMAND: node
            RCS_CCB_ARGS: /usr/local/bin/dsh-acp-wrapper.js
        volumes:
            - sandbox-dsh-workspaces:/app/workspaces

volumes:
    sandbox-dsh-workspaces:
