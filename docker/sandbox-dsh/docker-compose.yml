# docker/sandbox-dsh/ —— DSH 执行节点（DeepSeek Harness，占 ccb 槽位），连接主服务
# 权威文档：docs/operations/docker-topology.md §6（依赖目录契约）、§11.3（执行节点独立部署）
#
# 独立项目启动：
#   docker compose -f docker/sandbox-dsh/docker-compose.yml up -d
# 随主服务一键启动：docker/deploy.env 里 FENIX_FEATURE_SANDBOX_DSH=true
#
# 网络：接入 fenix-server（external）——节点是主动出网的一方（不需要被反向访问），但要按服务名直连主服务：
#       同机由脚本注入 ws://rcs:3000，依赖该网络的 DNS。独立节点机器上先 docker network create fenix-server；
#       若不复用该网络，请在 .env 填宿主可达的 RCS_URL（如 ws://192.168.1.10:3001）并删掉本文件的 networks 段。
# 必填连接配置：RCS_URL、RCS_SECRET（与主服务一致）、RCS_MACHINE_ID（控制台预创建或自动创建）
# 模型配置：主服务上为 Agent 绑定模型后自动下发，容器内无需配置

services:
    sandbox-dsh:
        # 例外：docker/ 下的依赖目录一律只引用发布镜像，只有本目录仍需从源码构建——
        # CI（.github/workflows/docker-publish-sandbox.yml）的 matrix 里没有 dsh，GHCR 上没有它的发布镜像。
        # 补上发布链路后，这里应改成 image: ghcr.io/huangpustar/fenixagent-sandbox-dsh:<tag>。
        build:
            context: ../../
            dockerfile: docker/sandbox-dsh/Dockerfile
        container_name: fenix-sandbox-dsh
        restart: unless-stopped
        environment:
            TZ: ${TZ:-Asia/Shanghai}
            RCS_URL: ${RCS_URL:?RCS_URL is required}
            RCS_SECRET: ${RCS_SECRET:?RCS_SECRET is required}
            RCS_MACHINE_ID: ${RCS_MACHINE_ID:?RCS_MACHINE_ID is required}
            # ccb 槽位的引擎命令：容器内的 acp-runtime（acp-runtime-cli）读取后注入 ccb handler，
            # 覆盖镜像 CMD 的 argv：
            #   node /usr/local/bin/dsh-acp-wrapper.js（wrapper 解析 ccb settings 生成 cordis.yml 并 exec dsh）
            # 这两个键是 daemon / 容器侧部署配置——宿主 env schema 不声明它们，写在宿主 .env 里不起作用。
            RCS_CCB_COMMAND: node
            RCS_CCB_ARGS: /usr/local/bin/dsh-acp-wrapper.js
        volumes:
            # 数据一律 bind 到本文件同级的 ./data/（文档 §6.5，不用命名卷）：随交付面整体搬迁/备份。
            # 容器内工作目录（Dockerfile 的 WORKDIR，也是 acp-runtime 的 cwd）。
            - ./data/workspaces:/app/workspaces
        networks:
            - fenix-server

networks:
    # 由顶层项目创建（文档 §3）：同机按 feature 开关启动时它已存在；
    # 独立节点机器上先 docker network create fenix-server，否则 external 网络缺失会让本文件无法启动。
    fenix-server:
        external: true
        name: fenix-server
