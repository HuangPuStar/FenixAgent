# RCS 接入配置（RCS 单独部署，本文件不启动 RCS）：
# 在 RCS 的环境文件中配置以下五项，密钥由受控文件 / secret store 注入：
# WORKFLOW_V2_UPSTREAM_BASE_URL=http://workflow-upstream:80
# WORKFLOW_CANVAS_UPSTREAM_URL=http://workflow-upstream:80
# （下面三枚供启用画布的部署使用；在声明侧是可选键，缺失不阻塞启动）
# WORKFLOW_V2_PLATFORM_ACCOUNT_EMAIL=<专用上游账号邮箱；经 docker/deploy.sh 部署时缺失会由它按主机名生成并固化>
# WORKFLOW_V2_PLATFORM_ACCOUNT_PASSWORD=<专用上游账号密码>
# WORKFLOW_V2_TICKET_SECRET=<至少 32 字节随机签名材料>
# 基础设施**全部在本目录**：每个栈一套实例，不与别的栈共用，也就没有互相影响的风险。
#   - `mysql`（mysql:8.4.5；库 opencoze / 账号 coze）：schema.sql 与 Atlas 收敛仍由本目录的一次性服务
#     mysql-init / atlas-init 承担；数据落 ./data/mysql。
#   - `rustfs`（rustfs/rustfs:1.0.1，S3 兼容对象存储）：建桶与图标播种由本目录的一次性服务 s3-init 承担
#     （原先写在栈内 minio 容器的 entrypoint 里，minio 已退役）；数据落 ./data/rustfs。
#     对象存储**只用 RustFS**，不引回 MinIO。
#   - 两者都只在本项目网络内：不接 fenix-server、不发布宿主端口。凭据是本栈私有键（WORKFLOW_MYSQL_* /
#     WORKFLOW_S3_*，见 .env.example），与主服务 env 无关。
# Elasticsearch / redis / etcd / Milvus / NSQ 同样在本目录，数据在 `./data/` 下。
#   - 启动顺序：本目录**自包含**——`docker compose -f docker/workflow/docker-compose.yml up -d` 一次起全栈，
#     不依赖任何别的 Compose 项目；库与桶的就绪由项目内的 depends_on 表达（不再有跨项目等待）。
#   - 地址：容器内按服务名 mysql:3306 / rustfs:9000 访问，由本文件的 environment 显式注入
#     （Compose 里 environment 优先于 env_file），不需要改动任何上游配置文件。
#
# 只有出口 coze-web 接入 external 网络 fenix-server（平台 RCS 按服务名 workflow-upstream /
# workflow-storage 访问它）；其余服务使用 Compose 默认网络。
# RCS 接入 fenix-server，例如：
# services:
#   rcs:
#     networks: [fenix-server]
# networks:
#   fenix-server:
#     external: true
#     name: fenix-server
# workflow-upstream 与 workflow-storage 都指向 coze-web；存储经只读代理，**不直连栈内 rustfs**。
# 控制台与 /workflow-canvas/* 均经 RCS 同源入口，不直接将 BFF 反代到上游。
# RCS 需包含 workflow-v2 模块、控制台产物与完整 DDL / 数据迁移。
# 当前画布票据状态仍在 RCS 进程内；Redis 不解决跨副本票据校验，先按单进程部署。
#
# 上游交付面只有三个镜像（同一 tag 同一 commit）：
#   ghcr.io/konghayao/workflow-studio-server:<tag>      # coze-server；**初始化资产也在这里**（/app/upstream-assets）
#   ghcr.io/konghayao/workflow-studio-web-canvas:<tag>  # 画布子路径变体（构建期注入 WORKFLOW_CANVAS_BASE=/workflow-canvas/）
# 资产（mysql schema.sql / Atlas HCL / ES 四件 / etcd 配置 / 画布图标）随 server 镜像交付，由本目录的
# 一次性服务 assets-init 展开到宿主 `./assets/`；**本目录不再引用任何上游源码目录**，也不需要 clone。
#
# 启动（随主服务一键启动，推荐）：
#   docker/deploy.env 打开 FENIX_FEATURE_WORKFLOW
#   ./docker/deploy.sh up
# 独立启动：本目录 .env 由 ./docker/deploy.sh init 或手工从 .env.example 物化，然后
#   docker compose -f docker/workflow/docker-compose.yml up -d
# 宿主诊断入口 WEB_LISTEN_ADDR 默认 127.0.0.1:18081（避让同机 ragflow 的 18080，见 .env.example）。

name: fenix-workflow
services:
  mysql:
    # 本栈自带的关系库实例（每个栈一套，不与别的栈共用，也就没有互相影响的风险）。库名与账号名是
    # **本栈自己持有**的常量，不从环境传——它们不是部署参数，多一个入口只会多一处能改错的地方；
    # 口令是本栈私有键（见 .env.example）。表结构由 mysql-init（schema.sql）与 atlas-init（Atlas 收敛）
    # 落定，不由本服务承担。
    image: mysql:8.4.5
    restart: unless-stopped
    # 与上游栈原先的 mysqld 参数一致；库/表自身的字符集在 schema 里另有声明，这里只改服务器默认值。
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      # 口令写在数据目录里：已有数据时改 env 不会改库里的账号（要改口令得同时改库或重建数据目录）。
      MYSQL_ROOT_PASSWORD: ${WORKFLOW_MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: opencoze
      MYSQL_USER: coze
      MYSQL_PASSWORD: ${WORKFLOW_MYSQL_PASSWORD:-coze123}
    volumes:
      # 一律 bind 到本文件同级的 ./data/ 下（不用命名卷）：数据随交付面整体搬迁/备份。
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      # 用真实查询而不是 `mysqladmin ping`：ping 在口令不对时同样返回成功（服务器活着就算通过），
      # 那样「口令改了但数据目录还是旧的」这类漂移不会暴露；这里连不上就直接 unhealthy。
      # `$$` 是容器内 shell 展开（CMD-SHELL 形式）。
      test:
        [
          "CMD-SHELL",
          "mysql -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" -e 'SELECT 1' >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # 只在本项目网络内：不接 fenix-server、不发布宿主端口。
  rustfs:
    # 本栈自带的 S3 兼容对象存储（每个栈一套）。**只用 RustFS，不引回 MinIO**。
    image: rustfs/rustfs:1.0.1
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      # 实例侧凭据取自本栈私有键（与 s3-init / coze-server 用的同一对，改这里即全栈一致）。
      RUSTFS_ACCESS_KEY: ${WORKFLOW_S3_ACCESS_KEY:-workflow}
      RUSTFS_SECRET_KEY: ${WORKFLOW_S3_SECRET_KEY:-workflow-local-dev}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - ./data/rustfs:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # 同上：只在本项目网络内。
  assets-init:
    # 一次性资产展开（job 语义：执行完即退出，不常驻、不 restart）：把镜像内 /app/upstream-assets/docker
    # 下的初始化资产拷到宿主 ./assets/（本目录生成目录，不进版本控制）。为什么必须经这一跳：docker 不能把
    # 镜像里的路径直接挂进别的容器，而消费方（atlas-init / mysql-init / s3-init / elasticsearch / etcd）
    # 需要的是宿主上的真实文件；展开后它们按普通 bind 挂载读取，路径与原先挂上游源码目录时逐一对应。
    # 为什么用 server 镜像而不是新制品：资产与二进制同 commit、同 tag，天然对齐；该镜像 coze-server 本来
    # 就要拉取，这里不新增任何拉取面。代价是运行时镜像多约 6MB（README §2 记录了这个取舍）。
    image: ghcr.io/konghayao/workflow-studio-server:${WORKFLOW_STUDIO_TAG:?Set WORKFLOW_STUDIO_TAG（docker/workflow/.env，见 .env.example）}
    # 上游只发布 amd64（与 coze-server 同因）：写死平台，否则 arm64 主机（Mac）拉取直接报 no matching manifest。
    platform: linux/amd64
    restart: "no"
    environment:
      WORKFLOW_STUDIO_TAG: ${WORKFLOW_STUDIO_TAG:?Set WORKFLOW_STUDIO_TAG（docker/workflow/.env，见 .env.example）}
    entrypoint: ["/bin/sh", "-c"]
    # 幂等：先清空目标目录再整体拷贝，tag 变更时不会残留上一版文件；不是纯覆盖写，见 README §2 的重跑口径。
    # 显式覆盖 entrypoint：镜像自带的是 /app/opencoze，不覆盖会去启动应用。
    command:
      - |
        set -e
        if [ ! -d /app/upstream-assets/docker ]; then
          echo "当前 tag 的镜像里没有 /app/upstream-assets：它早于「初始化资产随镜像交付」的发布。" >&2
          echo "处理：把 WORKFLOW_STUDIO_TAG 换成带资产的新 tag（见 docker/workflow/README.md §2），再重跑本服务。" >&2
          exit 1
        fi
        find /out -mindepth 1 -maxdepth 1 -exec rm -rf {} +
        cp -a /app/upstream-assets/docker/. /out/
        printf 'workflow-studio@%s\n' "$WORKFLOW_STUDIO_TAG" > /out/.source
        echo "资产已展开：$(find /out -type f | wc -l) 个文件，来源 $WORKFLOW_STUDIO_TAG"
    volumes:
      # 短语法 + 默认 create_host_path：首次运行时宿主的 ./assets 还不存在，需要 docker 建出来（所以这里
      # **不能**用 create_host_path: false——那会让首跑直接失败）。
      - ./assets:/out
    # 只做本地文件拷贝，不需要任何网络：显式 none，避免它挂上项目默认网络（最小权限）。
    network_mode: none
  atlas-init:
    # 一次性 schema 迁移（job 语义），顺序与上游 mysql 容器原先的 entrypoint 一致：schema.sql 先落地
    # （见下面的 mysql-init ④），Atlas 再按 HCL 收敛差异。拆成独立服务是为了用固定版本的 Atlas 镜像
    # 替掉运行期 `curl -sSf https://atlasgo.sh | sh`（那是离线部署的最后一个出网点）。
    # 镜像 is distroless：没有 shell，command 直接给参数（entrypoint 是 /atlas）。
    image: arigaio/atlas:1.3.3-community
    restart: "no"
    depends_on:
      # 库、账号与 schema.sql 都由 mysql-init 落定；它成功退出即代表可以连、可以 apply。
      mysql-init:
        condition: service_completed_successfully
    command:
      - schema
      - apply
      # DSN 由本编排拼（与 coze-server 的 MYSQL_DSN 同源同值）：库名与账号名是本栈常量，口令取本栈私有键。
      # atlas 1.3.3 的 `schema apply` 要求 URL 经 --url 传入（位置参数形式已不被接受）。
      - --url
      - "mysql://coze:${WORKFLOW_MYSQL_PASSWORD:-coze123}@mysql:3306/opencoze?charset=utf8mb4&parseTime=True"
      - --to
      - file:///opencoze_latest_schema.hcl
      # 与上游 mysql 容器原先的调用逐字一致（同一个 --exclude 集合）。
      - --exclude
      - atlas_schema_revisions,table_*
      - --auto-approve
    volumes:
      - type: bind
        source: ./assets/atlas/opencoze_latest_schema.hcl
        target: /opencoze_latest_schema.hcl
        read_only: true
        bind:
          create_host_path: false
  mysql-init:
    # 一次性初始化（job 语义：执行完即退出，不常驻、不 restart），按顺序做完才放 coze-server 起来：
    #   等本栈实例可用并可认证 → 幂等创建库与账号 → 应用账号自检 → 应用上游 schema.sql。
    #   具体分支与报错文案见 docker/workflow/init-mysql.sh（本目录的交付面文件，随目录一起交付）。
    # 为什么实例已经用 MYSQL_DATABASE / MYSQL_USER 建过一遍还要做：那两个键只在实例的**数据目录首次初始化**
    # 时生效，对已经存在的目录无效；本服务把「库和账号存在」变成每次启动都复核的前置，脚本可重跑。
    # 幂等：CREATE ... IF NOT EXISTS / GRANT 都可重复执行，重跑不覆盖既有数据（见脚本头注释）。
    # 镜像复用本目录已有的 mysql:8.4.5（自带 mysql 客户端与 curl，原 mysql 服务同款），不新增镜像来源。
    image: mysql:8.4.5
    restart: "no"
    environment:
      # 容器内地址写显式值（不插值同名宿主键，文档 §8.4）：mysql 是本栈实例在项目默认网络上的服务名。
      MYSQL_HOST: mysql
      # 库名与账号名是本栈常量（与 mysql 服务、coze-server 的 MYSQL_DSN 同值）；口令是本栈私有键。
      MYSQL_DATABASE: opencoze
      MYSQL_USER: coze
      MYSQL_PASSWORD: ${WORKFLOW_MYSQL_PASSWORD:-coze123}
      MYSQL_ROOT_PASSWORD: ${WORKFLOW_MYSQL_ROOT_PASSWORD:-root}
    depends_on:
      # 栈内实例：就绪由它自己的健康检查保证（跨项目等待已不存在）。
      mysql:
        condition: service_healthy
      # 资产由 assets-init 展开到 ./assets；文件是否齐备由下面的 create_host_path: false 显式兜底。
      assets-init:
        condition: service_completed_successfully
    volumes:
      # create_host_path: false → 脚本或资产缺失时直接报错，而不是被 docker 静默建成一个同名目录
      - type: bind
        source: ./init-mysql.sh
        target: /init/init-mysql.sh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./assets/volumes/mysql/schema.sql
        target: /schema.sql
        read_only: true
        bind:
          create_host_path: false
    # 初始化逻辑单独成文件（docker/workflow/init-mysql.sh），只读挂载后由 /bin/sh 解释执行：
    # compose 里保持「哪些服务、什么顺序、挂什么」可读，分支与报错文案留给脚本。
    # 必须显式覆盖 entrypoint：镜像自带的 entrypoint 会把参数当 mysqld 启动参数劫持掉。
    entrypoint: ["/bin/sh", "/init/init-mysql.sh"]
  s3-init:
    # 一次性初始化（job 语义：执行完即退出，不常驻、不 restart），按顺序做完才放 coze-server / milvus 起来：
    #   等本栈 rustfs 可用 → 幂等创建两个桶（opencoze / milvus）→ 用同一份凭据自检 → 播种画布图标。
    # 具体分支与报错文案见 docker/workflow/init-s3.sh（本目录的交付面文件，随目录一起交付）。
    # 为什么需要它：建桶与图标播种原先写在栈内 minio 容器的 entrypoint 里（上游形态）；minio 退役后那段
    #   初始化没有归属，改由本服务承担。顺带把「桶一定存在」变成 coze-server 的启动前置，而不是依赖上游
    #   自己的 createBucketIfNeed——它固定用 `cn-north-1` 建桶，在这里是个多余变量。
    # 幂等：PUT /<bucket> 命中已存在的桶时返回 409，脚本按「已存在」处理；重跑不动桶里任何对象。
    # 镜像复用本栈 rustfs 的同款 tag（仓库已有镜像，不新增来源）：镜像里的 curl 8.22.0 原生支持
    #   --aws-sigv4，建桶不需要 mc——仓库里带 mc 的只有 MinIO 镜像，用它等于把退役的制品引回来。
    image: rustfs/rustfs:1.0.1
    restart: "no"
    environment:
      # 容器内地址写显式值（不插值同名宿主键，文档 §8.4）：rustfs 是本栈实例在项目默认网络上的服务名。
      S3_ENDPOINT: rustfs:9000
      # 凭据是本栈私有键，与 rustfs 实例、coze-server 同源（改一处即全栈一致）。
      S3_ACCESS_KEY: ${WORKFLOW_S3_ACCESS_KEY:-workflow}
      S3_SECRET_KEY: ${WORKFLOW_S3_SECRET_KEY:-workflow-local-dev}
      # SigV4 签名域：RustFS 的默认 region。实例若改了 RUSTFS_REGION，这里必须同步（脚本头有说明）。
      S3_REGION: ${RUSTFS_REGION:-us-east-1}
    depends_on:
      # 栈内实例：就绪由它自己的健康检查保证（跨项目等待已不存在）。
      rustfs:
        condition: service_healthy
      assets-init:
        condition: service_completed_successfully
    volumes:
      # create_host_path: false → 脚本缺失时直接报错，而不是被 docker 静默建成一个同名目录
      - type: bind
        source: ./init-s3.sh
        target: /init/init-s3.sh
        read_only: true
        bind:
          create_host_path: false
      # 图标播种源：assets-init 从镜像展开的静态图标目录（原先挂的是上游 volumes/minio 下同样的两份）。
      # 这里用短语法（不设 create_host_path: false）：目录缺失时 docker 会建空的，脚本第 ④ 步会以
      # 「里面没有文件」出声——图标不是就绪前提，不该把整个栈卡死（见脚本头「例外」一段）。
      - ./assets/volumes/minio/default_icon:/seed/default_icon:ro
      - ./assets/volumes/minio/official_plugin_icon:/seed/official_plugin_icon:ro
    # 初始化逻辑单独成文件（docker/workflow/init-s3.sh），只读挂载后由 /bin/sh 解释执行。
    # 必须显式覆盖 entrypoint：镜像自带的 entrypoint 会把参数当成 rustfs 启动参数劫持掉。
    entrypoint: ["/bin/sh", "/init/init-s3.sh"]
  redis:
    image: bitnamilegacy/redis:8.0
    container_name: coze-redis
    restart: always
    user: root
    privileged: true
    environment:
      # 栈内服务的配置只由本编排显式给出：原先给这些服务喂的是上游整份 docker/.env（上游单机形态的取值，
      # 其中 REDIS_* / ALLOW_EMPTY_PASSWORD 一类键会与这里的取值重叠、形成二义），随资产改造一起去掉。
      - REDIS_AOF_ENABLED=${REDIS_AOF_ENABLED:-no}
      - REDIS_PORT_NUMBER=${REDIS_PORT_NUMBER:-6379}
      - REDIS_IO_THREADS=${REDIS_IO_THREADS:-4}
      - ALLOW_EMPTY_PASSWORD=${ALLOW_EMPTY_PASSWORD:-yes}
    volumes:
      - ./data/redis:/bitnami/redis/data:rw,Z
    command: |
      bash -c "
        /opt/bitnami/scripts/redis/setup.sh
        # Set proper permissions for data directories
        chown -R redis:redis /bitnami/redis/data
        chmod g+s /bitnami/redis/data

        exec /opt/bitnami/scripts/redis/entrypoint.sh /opt/bitnami/scripts/redis/run.sh
      "
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s
  elasticsearch:
    image: bitnamilegacy/elasticsearch:8.18.0
    container_name: coze-elasticsearch
    restart: always
    user: root
    privileged: true
    environment:
      - TEST=1
    depends_on:
      assets-init:
        condition: service_completed_successfully
    volumes:
      - ./data/elasticsearch:/bitnami/elasticsearch/data
      # 下面四件全部由 assets-init 从镜像展开（路径与原先挂上游 volumes/elasticsearch 时逐一对应）：
      - >-
        ./assets/volumes/elasticsearch/elasticsearch.yml:/opt/bitnami/elasticsearch/config/my_elasticsearch.yml
      - >-
        ./assets/volumes/elasticsearch/analysis-smartcn.zip:/opt/bitnami/elasticsearch/analysis-smartcn.zip:rw,Z
      - ./assets/volumes/elasticsearch/setup_es.sh:/setup_es.sh
      - ./assets/volumes/elasticsearch/es_index_schema:/es_index_schema
    healthcheck:
      test:
        - CMD-SHELL
        - curl -f http://localhost:9200 && [ -f /tmp/es_plugins_ready ] && [ -f /tmp/es_init_complete ]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s
    command: |
      bash -c "
        /opt/bitnami/scripts/elasticsearch/setup.sh
        # Set proper permissions for data directories
        chown -R elasticsearch:elasticsearch /bitnami/elasticsearch/data
        chmod g+s /bitnami/elasticsearch/data

        # Create plugin directory
        mkdir -p /bitnami/elasticsearch/plugins;

        # Unzip plugin to plugin directory and set correct permissions
        echo 'Installing smartcn plugin...';
        if [ ! -d /opt/bitnami/elasticsearch/plugins/analysis-smartcn ]; then

          # Download plugin package locally
          echo 'Copying smartcn plugin...';
          cp /opt/bitnami/elasticsearch/analysis-smartcn.zip /tmp/analysis-smartcn.zip

          elasticsearch-plugin install file:///tmp/analysis-smartcn.zip
          if [[ "$$?" != "0" ]]; then
            echo 'Plugin installation failed, exiting operation';
            rm -rf /opt/bitnami/elasticsearch/plugins/analysis-smartcn
            exit 1;
          fi;
          rm -f /tmp/analysis-smartcn.zip;
        fi;

        # Create marker file indicating plugin installation success
        touch /tmp/es_plugins_ready;
        echo 'Plugin installation successful, marker file created';

        # Start initialization script in background
        (
          echo 'Waiting for Elasticsearch to be ready...'
          until curl -s -f http://localhost:9200/_cat/health >/dev/null 2>&1; do
            echo 'Elasticsearch not ready, waiting...'
            sleep 2
          done
          echo 'Elasticsearch is ready!'

          # Run ES initialization script
          echo 'Running Elasticsearch initialization...'
          sed 's/\r$$//' /setup_es.sh > /setup_es_fixed.sh
          chmod +x /setup_es_fixed.sh
          /setup_es_fixed.sh --index-dir /es_index_schema
          # Create marker file indicating initialization completion
          touch /tmp/es_init_complete
          echo 'Elasticsearch initialization completed successfully!'
        ) &

        # Start Elasticsearch
        exec /opt/bitnami/scripts/elasticsearch/entrypoint.sh /opt/bitnami/scripts/elasticsearch/run.sh
        echo -e "⏳ Adjusting Elasticsearch disk watermark settings..."
      "
  etcd:
    image: bitnamilegacy/etcd:3.5
    container_name: coze-etcd
    user: root
    restart: always
    privileged: true
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ALLOW_NONE_AUTHENTICATION=yes
    depends_on:
      assets-init:
        condition: service_completed_successfully
    volumes:
      - ./data/etcd:/bitnami/etcd:rw,Z
      # 上游这份配置是**空文件**（0 字节）：挂它等于「覆盖掉镜像自带的同名配置」，行为要按空配置理解，
      # 不要当成可编辑项。文件由 assets-init 展开，内容与上游逐字节一致。
      - ./assets/volumes/etcd/etcd.conf.yml:/opt/bitnami/etcd/conf/etcd.conf.yml:ro,Z
    command: |
      bash -c "
        /opt/bitnami/scripts/etcd/setup.sh
        # Set proper permissions for data and config directories
        chown -R etcd:etcd /bitnami/etcd
        chmod g+s /bitnami/etcd

        exec /opt/bitnami/scripts/etcd/entrypoint.sh /opt/bitnami/scripts/etcd/run.sh
      "
    healthcheck:
      test:
        - CMD
        - etcdctl
        - endpoint
        - health
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s
  milvus:
    container_name: coze-milvus
    image: milvusdb/milvus:v2.5.10
    user: root
    privileged: true
    restart: always
    command: |
      bash -c "
        # Set proper permissions for data directories
        chown -R root:root /var/lib/milvus
        chmod g+s /var/lib/milvus

        exec milvus run standalone
      "
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      # 对象存储是本栈 rustfs：地址写显式服务名，凭据取本栈私有键。
      # 变量的 MINIO_* 拼写是 Milvus 自己的配置键，改不了——它说的是「S3 兼容存储」，不是「MinIO 服务」。
      MINIO_ADDRESS: rustfs:9000
      MINIO_BUCKET_NAME: milvus
      MINIO_ACCESS_KEY_ID: ${WORKFLOW_S3_ACCESS_KEY:-workflow}
      MINIO_SECRET_ACCESS_KEY: ${WORKFLOW_S3_SECRET_KEY:-workflow-local-dev}
      MINIO_USE_SSL: false
      LOG_LEVEL: debug
    volumes:
      - ./data/milvus:/var/lib/milvus:rw,Z
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:9091/healthz
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s
    depends_on:
      etcd:
        condition: service_healthy
      # 桶初始化跑完为前置：s3-init 自己带对实例的等待与诊断，milvus 不必再各自重试（失败码会在这里显式卡住）。
      s3-init:
        condition: service_completed_successfully
    networks:
      # 只用默认网络：etcd / rustfs 等服务名都在这里解析。
      default: {}
  nsqlookupd:
    image: nsqio/nsq:v1.2.1
    container_name: coze-nsqlookupd
    command: /nsqlookupd
    restart: always
    healthcheck:
      test:
        - CMD-SHELL
        - nsqlookupd --version
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s
  nsqd:
    image: nsqio/nsq:v1.2.1
    container_name: coze-nsqd
    command: /nsqd --lookupd-tcp-address=nsqlookupd:4160 --broadcast-address=nsqd
    restart: always
    depends_on:
      nsqlookupd:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - /nsqd --version
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s
  nsqadmin:
    image: nsqio/nsq:v1.2.1
    container_name: coze-nsqadmin
    command: /nsqadmin --lookupd-http-address=nsqlookupd:4161
    restart: always
    depends_on:
      nsqlookupd:
        condition: service_healthy
  coze-server:
    # 上游只发布 amd64（GHCR 上无 arm64 变体）：写死平台，否则 arm64 主机（Mac）拉取直接报
    # no matching manifest；上游补发 arm64 后与 coze-web 一起删除本行。
    image: ghcr.io/konghayao/workflow-studio-server:${WORKFLOW_STUDIO_TAG:?Set WORKFLOW_STUDIO_TAG（docker/workflow/.env，见 .env.example）}
    platform: linux/amd64
    restart: always
    container_name: coze-server
    # 应用配置只来自本目录 .env（业务面 + 编排参数）。它是**叠加层**：镜像内 /app/.env 已带全部上游默认值，
    # 这里只覆盖改动过的键；因此不再有「把上游 docker/.env 整份挂进 /app/.env」这一步，也不存在两处配置漂移。
    env_file:
      - ./.env
    # 指向栈内服务的键全部由本编排显式注入（Compose 里 environment 优先于 env_file），
    # 让「这个栈连到哪里」在评审时集中可见，并避免 .env 被误编辑后指向别处。
    environment:
      # --- 本栈 MySQL：库/账号是常量，由 mysql-init 幂等复核；口令取本栈私有键 ---
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: opencoze
      MYSQL_USER: coze
      MYSQL_PASSWORD: ${WORKFLOW_MYSQL_PASSWORD:-coze123}
      # 应用直接读 MYSQL_DSN（godotenv 不展开 ${}），所以这里拼好整条，与 atlas-init 的 --url 同源同值。
      MYSQL_DSN: "coze:${WORKFLOW_MYSQL_PASSWORD:-coze123}@tcp(mysql:3306)/opencoze?charset=utf8mb4&parseTime=True"
      # --- 栈内服务：服务名与端口写显式值，取值与上游默认一致，写出来是为了可评审 ---
      REDIS_ADDR: redis:6379
      ES_ADDR: http://elasticsearch:9200
      MILVUS_ADDR: milvus:19530
      MQ_NAME_SERVER: nsqd:4150
      COZE_MQ_TYPE: nsq
      VECTOR_STORE_TYPE: milvus
      # --- 对象存储：本栈 rustfs。这些键**覆盖** env_file 里的同名值 ---
      # 地址写显式服务名，不插值同名宿主键（文档 §8.4）；rustfs 在本项目默认网络上。
      MINIO_ENDPOINT: rustfs:9000
      # 预签名 URL 的签名域：必须同时满足两件事——① 出口代理能把它改写成 workflow-storage
      # （nginx.conf 的 sub_filter 写死了这个值）；② 存储虚拟主机的 Host 与它逐字相同（否则签名不匹配）。
      MINIO_API_HOST: http://rustfs:9000
      MINIO_AK: ${WORKFLOW_S3_ACCESS_KEY:-workflow}
      MINIO_SK: ${WORKFLOW_S3_SECRET_KEY:-workflow-local-dev}
      # 字符串形式的 "false"：Compose 的 environment 只收字符串，写裸 false 会被当成布尔值。
      MINIO_USE_SSL: "false"
      STORAGE_TYPE: minio
      FILE_UPLOAD_COMPONENT_TYPE: storage
      # 桶名显式写死（上游默认也是它）：平台按 `/opencoze/` 前缀识别存储直链
      # （packages/resources/workflow-v2/src/server/services/canvas-passthrough.ts），且 s3-init 建的就是这个桶。
      # 写在这里是为了让「谁读哪个桶」在评审时一眼可比，改名要三处一起改。
      STORAGE_BUCKET: opencoze
    depends_on:
      # 库与桶都由本栈的一次性初始化服务落定：mysql-init 成功退出即代表实例可用且 schema.sql 已应用；
      # atlas-init 成功退出即代表 Atlas 收敛完成；s3-init 成功退出即代表两个桶（opencoze / milvus）已就绪。
      mysql-init:
        condition: service_completed_successfully
      atlas-init:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      milvus:
        condition: service_healthy
    networks:
      # 只用默认网络：mysql / rustfs / redis / elasticsearch / milvus / nsq 等服务名都在这里解析。
      # 本栈不跨项目访问任何服务，因此不进 fenix-server（接入面越小，同名解析歧义越不可能出现）。
      default: {}
    command:
      - /app/opencoze
  coze-web:
    # 画布子路径变体：与 workflow-studio-server 同 commit 同 tag，构建期已注入
    # WORKFLOW_CANVAS_BASE=/workflow-canvas/（资源前缀与 router basename 都是它）。镜像内 nginx 只在
    # 根路径 / 提供 SPA，dist 未下沉，**不提供 /workflow-canvas/ location、也不做 SPA 回退**：前缀剥离
    # 与回退分别由平台静态反代（RCS workflow-v2）与本目录 nginx.conf 负责。
    # 它替代了原先「clone 上游源码 + 本地构建 + 只读挂载 dist」的画布交付方式。
    # 主 nginx.conf 也不再挂上游那份：镜像自带 nginx:1.25-alpine 的默认主配置（已 include
    # /etc/nginx/conf.d/*.conf），唯一有行为差异的 client_max_body_size 由本目录站点配置就地声明。
    # 与 coze-server 同因：上游只发布 amd64，写死平台，arm64 主机（Mac）才拉得到。
    image: ghcr.io/konghayao/workflow-studio-web-canvas:${WORKFLOW_STUDIO_TAG:?Set WORKFLOW_STUDIO_TAG（docker/workflow/.env，见 .env.example）}
    platform: linux/amd64
    container_name: coze-web
    restart: always
    ports:
      - ${WEB_LISTEN_ADDR:?Set WEB_LISTEN_ADDR（docker/workflow/.env，见 .env.example）}:80
    volumes:
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      - coze-server
    networks:
      default: {}
      fenix-server:
        aliases:
          - workflow-upstream
          - workflow-storage
networks:
  fenix-server:
    name: fenix-server
    external: true
