server {
    listen 80 default_server;
    server_name _;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        index index.html;
    }

    location ~ ^/(api|v[1-3]|admin)(/|$) {
        proxy_pass http://coze-server:8888;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 600s;
        sub_filter 'rustfs:9000' 'workflow-storage';
        sub_filter_once off;
        sub_filter_types application/json text/event-stream;
    }
}

server {
    listen 80;
    server_name workflow-storage;

    location /opencoze/ {
        limit_except GET HEAD {
            deny all;
        }
        if ($args ~* "(^|.*&)x-wf-file_name=[^&]*(&.*|$)") {
            set $args $1$2;
        }
        if ($args ~* "^x-wf-file_name=[^&]*$") {
            set $args "";
        }
        # 直连共享 rustfs（服务名在 fenix-server 上，coze-web 接入了该网络）。
        # 必须在 nginx 启动时就能解析：共享实例没起时本容器会以
        # "host not found in upstream \"rustfs\"" 直接起不来——这是启动顺序不变量的表现，见 README §7。
        proxy_pass http://rustfs:9000;
        # Host 必须与 coze-server 签名时用的域逐字相同（MINIO_API_HOST=http://rustfs:9000），
        # 否则 SigV4 校验失败；上面 sub_filter 改写的是回给浏览器的 URL，不是这里。
        proxy_set_header Host rustfs:9000;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    location / {
        return 404;
    }
}
