name: openobserve
services:
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:v1.1.2
    restart: unless-stopped
    environment:
      ZO_DATA_DIR: /data
      ZO_ROOT_USER_EMAIL: ${ZO_ROOT_USER_EMAIL:?set ZO_ROOT_USER_EMAIL}
      ZO_ROOT_USER_PASSWORD: ${ZO_ROOT_USER_PASSWORD:?set ZO_ROOT_USER_PASSWORD}
    volumes:
      - type: bind
        source: ./data
        target: /data
        bind: {create_host_path: false}
    ports: ["127.0.0.1:5080:5080"]
    networks: [fenix-server]
    mem_limit: 2g
    cpus: 2.0
    stop_grace_period: 60s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
networks:
  fenix-server:
    external: true
    name: fenix-server
