# docker/dev/ —— Agent Sites 站点发布运行时（agent-config 模块使用）
#
# 本文件是**本地开发编排**，由仓库根 docker-compose.yml 通过 include 复制进同一个项目（fenix），
# 用 `docker compose --profile agent-sites up -d` 启动。生产形态是 docker/agent-sites/。
#
# 与生产形态的差异有四处：① 新增 profiles（默认不启动）；② 网络由 `external: true` 改为
# `{name: fenix-server}`（同项目同网，按服务名直连）；③ 密钥由 `${VAR:?}` 改为带默认值
# （AGENT_SITES_MASTER_KEY）；④ 数据落 docker/dev/data/agent-sites/。
# 站点运行参数一字不改。
#
# 网络：接入 fenix-server（rcs 按 http://agent-sites:3000 访问）；
# 宿主端口只绑回环，仅供本机调试；站点对外访问统一经 RCS 反向代理。

services:

    agent-sites:
        # 上游只发布 amd64（GHCR 上无 arm64 变体）：写死平台，否则 arm64 主机（Mac）拉取直接报
        # no matching manifest（文档 §13 硬约束 14）；上游补发 arm64 后与 docker/agent-sites/ 一起删除本行。
        image: ghcr.io/konghayao/agent-sites:v0.3.2
        platform: linux/amd64
        profiles: ["agent-sites"]
        restart: unless-stopped
        networks:
            - fenix-server
        environment:
            HOST: 0.0.0.0
            PORT: 3000
            # PocketBase 实例端口范围（站点运行时）
            PB_PORT_MIN: 9000
            PB_PORT_MAX: 11000
            MAX_APPS: 50
            # 站点部署密钥：rcs 侧用**同一个插值键名**引用，两处自动同值、零人工同步。
            # 默认值只服务本地，生产必须覆盖。
            AGENT_SITES_MASTER_KEY: ${AGENT_SITES_MASTER_KEY:-agent-sites-master-key-123}
        volumes:
            - ./data/agent-sites/data:/app/data
            - ./data/agent-sites/public:/app/public
        ports:
            # 只绑回环：仅供本机调试，站点对外访问统一经 RCS 反向代理（文档 §6.4）。
            - "127.0.0.1:${AGENT_SITES_PORT:-26778}:3000"

networks:
    # 网络名与仓库根编排逐字一致，且**不写 `external: true`**：include 是字段级合并，根文件声明了
    # `name` 却没声明 `external`，子文件里的 `external: true` 会原样保留下来，`up` 直接报
    # `network fenix-server declared as external, but could not be found`（已实测）。
    # 本写法两边都成立：合并进根文件时与根文件的定义等价，单独解析时自己创建这张网。
    fenix-server:
        name: fenix-server
