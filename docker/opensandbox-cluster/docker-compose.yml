services:
  opensandbox-cluster:
    build:
      context: ../..
      dockerfile: docker/opensandbox-cluster/Dockerfile
    image: ${OPENSANDBOX_CLUSTER_IMAGE:-aos/opensandbox-cluster:latest}
    ports:
      - "${PORT:-8080}:8080"
    expose:
      - "8081"
    env_file:
      - .env
    environment:
      FRP_PUBLIC_ADDRESS: ${FRP_PUBLIC_ADDRESS:?FRP_PUBLIC_ADDRESS is required}
      FRP_BIND_PORT: ${FRP_BIND_PORT:-7000}
      FRP_TOKEN: ${FRP_TOKEN:?FRP_TOKEN is required}
    volumes:
      - opensandbox-cluster-data:/data
    restart: unless-stopped
    networks:
      - cluster-internal

  frps:
    image: ghcr.io/fatedier/frps:v0.69.0
    command: ["-c", "/etc/frp/frps.toml"]
    ports:
      - "${FRP_BIND_PORT:-7000}:7000"
    expose:
      - "7080"
    environment:
      FRP_TOKEN: ${FRP_TOKEN:?FRP_TOKEN is required}
    volumes:
      - ./frps.toml:/etc/frp/frps.toml:ro
    depends_on:
      - opensandbox-cluster
    networks:
      - cluster-internal
    restart: unless-stopped

volumes:
  opensandbox-cluster-data:

networks:
  cluster-internal:
    name: opensandbox-cluster-internal
