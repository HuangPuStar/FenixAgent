# 独立沙盒机的三种服务合一编排（Cluster + frps + Server）
#
# 用途：给**不跑 FenixAgent 平台**的沙盒机一次性起整套管理面与执行节点（离线部署流程见同目录
# fenix-integration.md）。平台所在的机器不用这一份：那边的 Cluster 与节点分别由
# docker/opensandbox-cluster/ 与 docker/opensandbox-server/ 提供，两者经共享网络 fenix-server 互通、
# 宿主端口只绑回环（见 docs/operations/docker-topology.md §3、§6）。
#
# 本文件因此是**另一个部署单元**而非前两者的副本：它按「一台机器既是管理面又是节点」组网
# （自建 opensandbox 网络、管理端口对局域网开放），不引用 fenix-server。
# 镜像 tag 与 docker/opensandbox-cluster/、docker/opensandbox-server/ 保持一致，升级时三处同改。

services:
  opensandbox-cluster:
    image: ghcr.io/huangpustar/fenixagent-opensandbox-cluster:v0.2.0
    ports:
      - "${OPENSANDBOX_CLUSTER_PORT:-8080}:8080"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_PATH: /data/opensandbox-cluster.db
      CLUSTER_SERVICE_API_KEY: ${CLUSTER_SERVICE_API_KEY:?CLUSTER_SERVICE_API_KEY is required}
      SERVER_API_KEY_ENCRYPTION_KEY: ${SERVER_API_KEY_ENCRYPTION_KEY:?SERVER_API_KEY_ENCRYPTION_KEY is required}
      PROXY_CONNECT_TIMEOUT_MS: ${PROXY_CONNECT_TIMEOUT_MS:-3000}
      PROXY_RESPONSE_TIMEOUT_MS: ${PROXY_RESPONSE_TIMEOUT_MS:-120000}
      FRP_PUBLIC_ADDRESS: ${FRP_PUBLIC_ADDRESS:?FRP_PUBLIC_ADDRESS is required}
      FRP_BIND_PORT: ${FRP_BIND_PORT:-7000}
      FRP_TOKEN: ${FRP_TOKEN:?FRP_TOKEN is required}
    volumes:
      - ./opensandbox-cluster-data:/data
    networks:
      - opensandbox
    restart: unless-stopped

  frps:
    image: ghcr.io/fatedier/frps:v0.69.0
    command: ["-c", "/etc/frp/frps.toml"]
    ports:
      - "${FRP_BIND_PORT:-7000}:7000"
    expose:
      - "7080"
    environment:
      FRP_TOKEN: ${FRP_TOKEN:?FRP_TOKEN is required}
    volumes:
      - ../frps.toml:/etc/frp/frps.toml:ro
    depends_on:
      - opensandbox-cluster
    networks:
      - opensandbox
    restart: unless-stopped

  opensandbox-server:
    image: ghcr.io/huangpustar/fenixagent-opensandbox-server:v0.2.0
    command:
      - opensandbox-server
      - --config
      - /etc/opensandbox/sandbox.toml
    privileged: true
    cgroup: host
    ports:
      - "${OPENSANDBOX_SERVER_PORT:-8090}:8080"
      - "${SANDBOX_PORT_MIN:-10000}-${SANDBOX_PORT_MAX:-10100}:${SANDBOX_PORT_MIN:-10000}-${SANDBOX_PORT_MAX:-10100}"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    volumes:
      - ./opensandbox-server-docker-data:/var/lib/docker
      - ./workspace:/workspace
      - ./offline:/offline:ro
      - ./sandbox.toml:/etc/opensandbox/sandbox.toml:ro
      - ./data:/root/.opensandbox
    networks:
      - opensandbox
    restart: unless-stopped

networks:
  opensandbox:
    name: opensandbox
