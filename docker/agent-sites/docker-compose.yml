# docker/agent-sites/ —— Agent Sites 站点发布运行时（agent-config 模块使用）
# 权威文档：docs/operations/docker-topology.md §6（依赖目录契约）
#
# 独立项目启动（站点可在独立机器部署）：
#   cp docker/agent-sites/.env.example docker/agent-sites/.env
#   docker compose -f docker/agent-sites/docker-compose.yml up -d
# 随主服务一键启动：docker/deploy.env 里 FENIX_FEATURE_AGENT_SITES=true
#
# 网络：接入 fenix-server（主服务按 http://agent-sites:3000 访问）；
# 宿主端口只绑回环，仅供同机调试；站点对外访问统一经 RCS 反向代理。

services:

    agent-sites:
        # 上游只发布 amd64（GHCR 上无 arm64 变体）：写死平台，否则 arm64 主机（Mac）拉取直接报
        # no matching manifest；上游补发 arm64 后删除本行。
        image: ghcr.io/konghayao/agent-sites:v0.4.3
        platform: linux/amd64
        restart: unless-stopped
        networks:
            - fenix-server
        environment:
            HOST: 0.0.0.0
            PORT: 3000
            # PocketBase 实例端口范围（站点运行时）
            PB_PORT_MIN: 9000
            PB_PORT_MAX: 11000
            MAX_APPS: 50
            # 与主服务共值的键：独立部署填本目录 .env（见 .env.example）；随主服务启动时由 deploy.sh
            # 导出主服务 env 带入同名键，两处同值。本目录不读别的目录的配置。
            AGENT_SITES_MASTER_KEY: ${AGENT_SITES_MASTER_KEY:?AGENT_SITES_MASTER_KEY 未设置：请填 docker/agent-sites/.env（cp .env.example .env 后填「必需」段）；随主服务启动时由 ./docker/deploy.sh 从主服务 env 带入，两侧必须同值}
        volumes:
            - ./data:/app/data
            - ./public:/app/public
        ports:
            # 只绑回环：仅供同机调试，站点对外访问经 RCS 反向代理。
            - "127.0.0.1:${AGENT_SITES_PORT:-26778}:3000"

networks:
    fenix-server:
        external: true
