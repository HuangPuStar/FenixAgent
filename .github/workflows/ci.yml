name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck (backend)
        run: bun run typecheck

      - name: Typecheck (frontend)
        run: bun run typecheck:web

      # 装配相关的三项检查必须与 precheck 走同一入口：registry 是生成物，架构门禁与依赖边界门禁
      # 共用同一份例外台账，只在本机生效等于没有门禁。
      - name: Generated module registry is up to date
        run: bun run generate:module-registry --check

      - name: Architecture boundaries
        run: bun run architecture:check

      - name: Workspace dependency boundaries
        run: bun run check:dependencies

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Server, script, and platform SDK tests
        run: bun test apps/server/src/__tests__/ scripts/__tests__/ packages/platform/platform-sdk/src/__tests__/

      - name: Package tests
        run: bun test packages/

      - name: Web app tests
        run: bun test apps/web/src/__tests__/
