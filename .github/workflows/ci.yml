name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 墙钟时间由两个事实决定（2026-10-13 run 38360225752 的 step 实测）：
#   1. 重活只有两个，各约 200s——静态检查里的 `typecheck:packages` 187s、测试里的 packages 批 205s
#      （9559 用例 / 815 文件）——两者分属两个 job 并行跑，总时长 = 较长那条 ≈ 5min；
#   2. 每个 job 自己装一次依赖（33-40s），而 `bun.lock` 把 tarball URL 写死在国内镜像上（理由见
#      `.github/actions/setup/action.yml`），runner 却在 us-northcentralus。
# 所以本文件只做两件事：把两个重活用 bun 原生 `--shard=i/N` 摊到多台 runner；用缓存免掉冷装。
# 分片不改变口径——bun 自己切分文件集，各片并集恒等于该批全量，`--isolate` 一字不动，参数与
# `scripts/lib/check-gates.ts` 的全量命令只差一个 `--shard`（precheck 仍跑全量命令，见该文件注释）。
# 上面的 187s 是 `tsc` 时代的数：三处类型检查改用 `tsc-rs` 后（取舍见 `scripts/lib/check-gates.ts` 头部），
# 包级检查本机 40 包 CPU 约 43s，重活只剩测试里的 packages 批。
jobs:
  static:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      # 三条类型检查都用 `tsc-rs`（`scripts/lib/check-gates.ts` 里与本机 precheck 同源的那一份定义）。
      # 它只发布 linux / macOS / Windows × x64 / arm64 六个平台的二进制，本 job 的 ubuntu-latest（linux-x64）
      # 在其中；换成这六者之外的 runner 平台会让这三步直接失败（脚本探活后即退出，不回退官方 tsc）。
      - name: Typecheck (backend)
        run: bun run typecheck

      - name: Typecheck (frontend)
        run: bun run typecheck:web

      # 装配相关的四项检查必须与 precheck 走同一入口：registry、web contributions 与根源码归属清单
      # 都是生成物，架构门禁与依赖边界门禁共用同一份例外台账，只在本机生效等于没有门禁。
      - name: Generated module registry is up to date
        run: bun run generate:module-registry --check

      - name: Generated web contributions are up to date
        run: bun run generate:web-contributions --check

      - name: Root source owner inventory is up to date
        run: bun run check:root-owner-inventory

      # 表搬迁只搬位置、不改结构：`drizzle.config.ts` 声明的 schema 集合与已发布迁移链必须零
      # DDL 差异。这一步本地 `precheck`（scripts/ci.ts）已有，CI 此前缺它，等于 PR 阶段对
      # 「表定义换手时顺手改了 DDL」没有门禁。
      - name: Schema DDL drift
        run: bun run check:schema-ddl-drift

      - name: Architecture boundaries
        run: bun run architecture:check

      - name: Workspace dependency boundaries
        run: bun run check:dependencies

      # 后端从 `apps/web/dist/` 挂载静态资源；「包被浏览器 bundle 拉进 server-only 依赖」
      # 这类事故只在真实构建下暴露（vite 的解析与外置规则和 `bun test` 不同），此前只有
      # `Dockerfile` 在镜像构建时才跑，PR 阶段没有构建级门禁。`build:web` 只依赖已安装依赖
      # 与仓库内已提交的生成物，不需要 env（`Dockerfile` 同样在 install 之后直接执行）。
      # 原先是独立 job：那个 job 46s 里有 33s 是 install，为 9s 的构建付一整套安装不划算，并到这里。
      - name: Web production build
        run: bun run build:web

  # 包级类型检查逐个走各包自己的 tsconfig：前两步都从宿主入口出发、**顺 import** 覆盖包源码，
  # 没有消费方的包/文件因此天然落在检查之外（14 个包此前连 tsconfig 都没有）。
  # 本 job 原先是墙钟主项（`tsc` 时代 CI 实测 187s），切 `tsc-rs` 后本机 40 包 CPU 约 43s、墙钟十几秒——
  # 分片、`--shard` 与判定口径一字不变，保留独立 job 是为了不把这十几秒压回 static job 的串行段。
  typecheck-packages:
    name: Typecheck (packages ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      # 分片之间没有依赖：一片红不该让另一片的结果被取消（谁错了都要看全）。
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      # 这里原先缓存 `node_modules/.cache/fenix-precheck/*.tsbuildinfo`（`tsc` 的增量缓存）。改用
      # `tsc-rs` 后三处类型检查都带 `--incremental false`，不再有任何进程写这个目录，故整步删除：
      # 留着的唯一效果是每个分片多出一次无用的缓存恢复。
      - name: Typecheck (packages)
        run: bun run typecheck:packages --shard ${{ matrix.shard }}/2

  # 两条小批次（26s + 9s）原本挤在 Test job 里排在 205s 的 packages 批之后串行等待；独立成 job 后
  # 它们与分片并行，也不再压 Test job 的墙钟。
  test-apps:
    name: Test (apps, scripts & SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      # 这两条命令与 `scripts/lib/check-gates.ts` 的 `TEST_BATCHES` 逐字一致（不带 `--shard`，
      # 全量口径）：本机 `precheck` 与 CI 跑的是同一份口径，本地绿而 CI 红才算「同一批测试不一致」。
      #
      # `--isolate` 不是可选加速项：bun 1.4 默认让所有测试文件共享同一个全局与模块注册表，
      # `mock.module()` / `globalThis` 覆写 / 平台替身会泄漏给之后加载的文件，而加载顺序由文件系统的
      # 目录枚举顺序决定（Linux 与 macOS 不同）。缺它时同一份代码会本机全绿、这里成片失败。
      # 跑这三批的 bun 必须 ≥ 1.4.3：1.4.2 的 isolate 路径在大套件下会间歇 abort（见 setup action 注释）。
      - name: Server, script, and platform SDK tests
        run: bun test apps/server/src/__tests__/ scripts/__tests__/ packages/platform/platform-sdk/src/__tests__/ --isolate

      - name: Web app tests
        run: bun test apps/web/src/__tests__/ --isolate

  # packages 批是另一条 205s 的墙钟：815 个文件、9559 个用例，`--isolate` 下每个文件重新求值一次
  # 依赖图，实测并不随核数线性缩短（本机 10 核与 CI 4 核的墙钟接近），所以只能靠分片摊到多台 runner。
  test-packages:
    name: Test (packages ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      # 与 `TEST_BATCHES` 的 packages 批同一条命令，只多一个 bun 原生的 `--shard`：切分由 bun 自己做，
      # 各片并集恒等于该批全量（无重复、无遗漏），因此 precheck 跑全量与 CI 跑分片得到同一判定。
      - name: Package tests
        run: bun test packages/ --path-ignore-patterns 'tmp/**' --isolate --shard=${{ matrix.shard }}/3
