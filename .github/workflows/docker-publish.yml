name: Build & Publish Docker Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  # 用于验证构建链路本身的改动（runner、缓存策略、Dockerfile 结构），不必为此推一次 main。
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build (${{ matrix.platform }})
    # 两个平台拆到各自的原生 runner 上并行构建：arm64 走 QEMU 时 `apt-get install` 慢 4.6 倍、
    # `build:web` 慢 7.2 倍（2026-10-13 构建日志实测），而本仓库是 public 仓库，
    # ubuntu-24.04-arm 是免费的原生 arm64 runner。两个架构各有独立 cache scope，互不覆盖。
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            cache_scope: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            cache_scope: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR 的引用必须全小写，而 github.repository 保留大小写，这里统一转换一次。
      - name: Compute image reference
        run: echo "IMAGE_REF=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 单平台按 digest 推送，多平台 manifest 由 merge job 组装：单平台构建才能落在原生 runner 上。
      #
      # 缓存由 gha 改为 registry（GHCR）：gha 后端此前实测导出约 1.5GB 耗时 168s，且缓存 7 天
      # 未访问即被回收（上一次成功构建在 9/11，本次即全量重跑）；registry 缓存与镜像走同一通道，
      # 也不占仓库的 10GB 缓存配额。
      #
      # provenance 关闭：仓库内没有校验 SLSA 证明的消费方，attestation 只为导出增加体积与时间。
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_REF }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
            CACHE_BUST=${{ github.run_id }}
          cache-from: type=registry,ref=${{ env.IMAGE_REF }}:buildcache-${{ matrix.cache_scope }}
          cache-to: type=registry,ref=${{ env.IMAGE_REF }}:buildcache-${{ matrix.cache_scope }},mode=max

      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.cache_scope }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge manifest list
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Compute image reference
        run: echo "IMAGE_REF=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # tags 只在合并阶段计算：构建阶段按 digest 推送，不产生任何 tag。
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE_REF}@sha256:%s " *)

      - name: Inspect image
        run: docker buildx imagetools inspect "${IMAGE_REF}:${{ steps.meta.outputs.version }}"
