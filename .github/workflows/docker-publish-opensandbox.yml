name: Build & Publish OpenSandbox Images

on:
  workflow_dispatch:
    inputs:
      version:
        description: "镜像版本号（如 v0.2.0）"
        required: true
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cluster
            context: .
            dockerfile: ./docker/opensandbox-cluster/Dockerfile
          - name: server
            context: ./docker/opensandbox-server
            dockerfile: ./docker/opensandbox-server/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "版本号不是有效的 Docker tag：$VERSION" >&2
            exit 1
          fi

          repository=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          image="${{ env.REGISTRY }}/${repository}-opensandbox-${{ matrix.name }}"

          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$image:$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.title=fenixagent-opensandbox-${{ matrix.name }}
          cache-from: type=gha,scope=opensandbox-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=opensandbox-${{ matrix.name }}
