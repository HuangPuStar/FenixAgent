receivers:
  file_log/external:
    include: [/var/log/fenix-external/*.log]
    exclude: ["/var/log/fenix-external/rcs.*.log", "/var/log/fenix-external/rcs.err.*.log", "/var/log/fenix-external/sync-close.log"]
    start_at: end
    storage: file_storage
    max_log_size: 16KiB
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 5m
processors:
  resource/external:
    attributes:
      - {key: service.name, value: fenix-external, action: upsert}
      - {key: deployment.environment.name, value: "${env:DEPLOYMENT_ENVIRONMENT}", action: upsert}
service:
  pipelines:
    logs/external:
      receivers: [file_log/external]
      processors: [memory_limiter, resource/external, batch]
      exporters: [otlp_http/oo_logs]
