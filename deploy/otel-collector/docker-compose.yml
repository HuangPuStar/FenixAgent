name: otel-collector
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.163.2
    restart: unless-stopped
    user: "10001:10001"
    command:
      - --config=/etc/otelcol-contrib/collector.yaml
      - --config=/etc/otelcol-contrib/collector.browser.yaml
    env_file: [.env]
    environment:
      GOMEMLIMIT: 384MiB
      OO_AUTH_HEADER: ${OO_AUTH_HEADER:?set OO_AUTH_HEADER}
      HOST_ID: ${HOST_ID:?set HOST_ID}
      HOST_NAME: ${HOST_NAME:?set HOST_NAME}
      OTELCOL_INSTANCE_ID: ${OTELCOL_INSTANCE_ID:?set OTELCOL_INSTANCE_ID}
      OO_OTLP_ENDPOINT: ${OO_OTLP_ENDPOINT:?set OO_OTLP_ENDPOINT}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-production}
    volumes:
      - type: bind
        source: ./collector.yaml
        target: /etc/otelcol-contrib/collector.yaml
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./collector.browser.yaml
        target: /etc/otelcol-contrib/collector.browser.yaml
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./data
        target: /var/lib/otelcol
        bind: {create_host_path: false}
    ports:
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:4319:4319"
      - "127.0.0.1:13133:13133"
      - "127.0.0.1:8888:8888"
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 30s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
