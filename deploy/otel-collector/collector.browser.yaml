receivers:
  otlp/browser:
    protocols:
      http:
        endpoint: 0.0.0.0:4319
        max_request_body_size: 1048576
processors:
  transform/browser_resource:
    error_mode: propagate
    trace_statements: &resource_statements
      - context: resource
        statements:
          - keep_keys(attributes, [])
          - set(attributes["service.name"], "fenix-web")
          - set(attributes["service.namespace"], "fenix")
          - set(attributes["fenix.telemetry.source"], "browser")
          - set(attributes["deployment.environment.name"], "${env:DEPLOYMENT_ENVIRONMENT}")
    metric_statements: *resource_statements
    log_statements: *resource_statements
  filter/browser_metrics:
    error_mode: propagate
    metrics:
      metric:
        - 'not IsMatch(name, "^fenix\\.web\\.(events|lcp|inp|cls|history\\.duration)$")'
      datapoint:
        - 'attributes["page"] != "chat" and attributes["page"] != "console" and attributes["page"] != "login"'
        - 'attributes["event"] != nil and not IsMatch(attributes["event"], "^(disconnect|reconnect|history_ready|history_failure|error)$")'
        - 'attributes["result"] != nil and not IsMatch(attributes["result"], "^(success|failure)$")'
        - 'attributes["error.type"] != nil and not IsMatch(attributes["error.type"], "^(Error|TypeError|SyntaxError)$")'
  transform/browser_payload:
    error_mode: propagate
    metric_statements:
      - context: scope
        statements:
          - set(name, "fenix-browser")
          - set(version, "")
          - keep_keys(attributes, [])
      - context: datapoint
        statements:
          - keep_keys(attributes, ["page", "event", "vital", "result", "error.type"])
          - set(exemplars, [])
    trace_statements:
      - context: scope
        statements:
          - set(name, "fenix-browser")
          - set(version, "")
          - keep_keys(attributes, [])
      - context: span
        statements:
          - set(name, "browser.request")
          - keep_keys(attributes, [])
          - set(events, [])
          - set(links, [])
          - set(status.message, "")
    log_statements:
      - context: scope
        statements:
          - set(name, "fenix-browser")
          - set(version, "")
          - keep_keys(attributes, [])
      - context: log
        statements:
          - set(body, "browser.event")
          - keep_keys(attributes, ["event", "page", "error.type", "result"])
service:
  pipelines:
    traces/browser:
      receivers: [otlp/browser]
      processors: [memory_limiter, transform/browser_resource, transform/browser_payload, batch]
      exporters: [otlp_http/oo_traces]
    metrics/browser:
      receivers: [otlp/browser]
      processors: [memory_limiter, transform/browser_resource, filter/browser_metrics, transform/browser_payload, batch]
      exporters: [otlp_http/oo_metrics]
    logs/browser:
      receivers: [otlp/browser]
      processors: [memory_limiter, transform/browser_resource, transform/browser_payload, batch]
      exporters: [otlp_http/oo_logs]
