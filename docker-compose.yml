# 默认编排 — 启动 FenixAgent 与 PostgreSQL
# 本地开发仅启动数据库：docker compose up -d postgres

services:

    postgres:
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: rcs
            POSTGRES_PASSWORD: rcs
            POSTGRES_DB: rcs
        ports:
            - "5432:5432"
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U rcs"]
            interval: 5s
            timeout: 5s
            retries: 5

    rcs:
        # image: ghcr.io/huangpustar/fenixagent:main
        build:
            context: .
            dockerfile: Dockerfile
        restart: unless-stopped
        # 将根 .env 中的可选应用配置（包括模型网关）传给容器；缺失时仍可直接启动。
        env_file:
            - path: .env
              required: false
        depends_on:
            postgres:
                condition: service_healthy
        ports:
            - "3001:3000"
        environment:
            LOG_FORMAT: json
            RCS_HOST: 0.0.0.0
            RCS_PORT: 3000
            # 使用模版创建 Agent 功能需要如下环境变量
            # OPENAI_API_KEY:
            # OPENAI_BASE_URL: https://api.deepseek.com/v1/
            # OPENAI_MODEL: deepseek-v4-flash
            RCS_BASE_URL: http://localhost:3000
            RCS_API_KEYS: ${RCS_API_KEYS:-}
            REGISTRY_SECRET: "340b6908-031d-47de-9cfb-26f75818f969"
            DATABASE_URL: postgres://rcs:rcs@postgres:5432/rcs
            ACPX_G_URL: http://localhost:8848
            APP_BRAND_NAME: ${APP_BRAND_NAME:-Fenix}
            APP_LOGO_PATH: ${APP_LOGO_PATH:-}
            OPENCODE_DISABLE_AUTOUPDATE: "1"
            OPENCODE_DISABLE_TELEMETRY: "1"
            RCS_SECRET_ENCRYPTION_KEY: ${RCS_SECRET_ENCRYPTION_KEY:-}
        volumes:
            - rcs-opencode-config:/root/.config/opencode
            - rcs-opencode-data:/root/.local/share/opencode
            - ./data:/app/data
            - ./workflow:/app/workflow
            - ./workspaces:/app/workspaces
        # 在主进程启动前先完成数据库迁移
        command: ["sh", "-lc", "bun migrate.js && exec bun --no-install run dist/index.js"]
        healthcheck:
            test:
                [
                    "CMD",
                    "bun",
                    "-e",
                    "fetch('http://127.0.0.1:3000/health').then((r) => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
                ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 20s

volumes:
    postgres-data:
    rcs-opencode-config:
    rcs-opencode-data:
